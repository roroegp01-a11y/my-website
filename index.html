<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ສະຕ໋ອກເຄື່ອງລຸງແມັກ - Cloud POS</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <!-- ເພີ່ມ Script ຂອງ Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans Lao', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        secondary: '#8b5cf6', // Violet 500
                        dark: '#0f172a',
                        surface: '#ffffff',
                        background: '#f3f4f6'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;800&display=swap');
        body { font-family: 'Noto Sans Lao', sans-serif; background-color: #f3f4f6; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.5); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-enter { animation: enter 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Firebase Config (Stock-AC1C3)
        const firebaseConfig = {
            apiKey: "AIzaSyA0XqpDeXRcmePJ0wEVj5UixJg0PzO_tKY",
            authDomain: "stock-ac1c3.firebaseapp.com",
            projectId: "stock-ac1c3",
            storageBucket: "stock-ac1c3.firebasestorage.app",
            messagingSenderId: "31846633000",
            appId: "1:31846633000:web:54bf0ee62f9f6109d7ef1d",
            measurementId: "G-8G7NY8CK23"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Utility: Number Formatting
        const formatNum = (num) => Number(num || 0).toLocaleString('en-US');

        // Component: Icons
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [expenses, setExpenses] = useState([]); 
            
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [sortBy, setSortBy] = useState('name-asc');
            
            // Filters
            const [selectedCategory, setSelectedCategory] = useState('All'); 
            const [stockCategory, setStockCategory] = useState('All'); 
            
            // Modals State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isBulkModalOpen, setIsBulkModalOpen] = useState(false);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            
            const [editingProduct, setEditingProduct] = useState(null);
            
            // Form Data
            const [formData, setFormData] = useState({ 
                game: 'ML', pack: '', cost: 0, wholesale: 0, retail: 0, creditsUsed: 0, currentRate: 410, imageUrl: ''
            });

            // New Forms
            const [bulkData, setBulkData] = useState({ category: '', newRate: 0 });
            const [expenseForm, setExpenseForm] = useState({ title: '', amount: 0, note: '', category: 'ອື່ນໆ' });

            const expenseCategories = ['ຄ່າອາຫານ', 'ຄ່າເນັດ', 'ຄ່າໄຟ', 'ຄ່ານ້ຳ', 'ຄ່າເຊົ່າຮ້ານ', 'ເງິນເດືອນ', 'ຊື້ເຄື່ອງໃຊ້', 'ອື່ນໆ'];

            // 0. Telegram Web App Init (ຕັ້ງຄ່າເມື່ອເປີດໃນ Telegram)
            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();   // ບອກ Telegram ວ່າແອັບພ້ອມແລ້ວ
                    tg.expand();  // ຂະຫຍາຍແອັບໃຫ້ເຕັມໜ້າຈໍ
                }
            }, []);

            // 1. Auth & Initial Load
            useEffect(() => {
                auth.signInAnonymously().catch(e => setAuthError(e.message));
                return auth.onAuthStateChanged(u => {
                    if(u) { setUser(u); setAuthError(null); }
                });
            }, []);

            // 2. Data Sync
            useEffect(() => {
                if (!user) return;
                
                // Products
                const unsubProd = db.collection('products').onSnapshot(s => {
                    setProducts(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });
                
                // Sales
                const unsubSales = db.collection('sales').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setSales(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                // Expenses
                const unsubExp = db.collection('expenses').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setExpenses(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => { unsubProd(); unsubSales(); unsubExp(); };
            }, [user]);

            // Auto Calculate Cost in Form
            useEffect(() => {
                const parseVal = (val) => {
                    if (!val) return 0;
                    if (typeof val === 'number') return val;
                    return Number(val.replace(',', '.'));
                };
                const credits = parseVal(formData.creditsUsed);
                const rate = parseVal(formData.currentRate);
                const cost = credits * rate;
                if (cost >= 0 && cost !== formData.cost) setFormData(prev => ({ ...prev, cost }));
            }, [formData.creditsUsed, formData.currentRate]);

            // Handlers
            const handleMakeSale = async (product, type) => {
                if (!user) return;
                const price = type === 'retail' ? product.retail : product.wholesale;
                
                try {
                    // Record Sale
                    await db.collection('sales').add({
                        productName: `${product.game} - ${product.pack}`,
                        price, 
                        profit: price - product.cost, 
                        type, 
                        creditsUsed: product.creditsUsed || 0,
                        createdAt: Date.now(), 
                        timestamp: new Date().toLocaleString('lo-LA')
                    });
                } catch (err) { alert(err.message); }
            };

            const handleDeleteSale = async (id) => {
                // 1. Confirm deletion
                if(!confirm("ຕ້ອງການລຶບລາຍການຂາຍນີ້ບໍ?")) return;
                
                try {
                    // 2. Delete the sale
                    await db.collection('sales').doc(id).delete();
                } catch(e) { 
                    alert("ເກີດຂໍ້ຜິດພາດ: " + e.message); 
                }
            };

            const handleProductSave = async () => {
                if(!user) return;
                const finalCredits = typeof formData.creditsUsed === 'string' 
                    ? parseFloat(formData.creditsUsed.replace(',', '.')) 
                    : formData.creditsUsed;
                
                const data = { 
                    ...formData, 
                    creditsUsed: finalCredits || 0, 
                    profit: formData.retail - formData.cost, 
                    createdAt: Date.now() 
                };

                try {
                    if (editingProduct) await db.collection('products').doc(editingProduct.id).update(data);
                    else await db.collection('products').add(data);
                    setIsModalOpen(false);
                } catch(e) { alert(e.message); }
            };

            const handleProductDelete = async (id) => {
                if(confirm("ຢືນຢັນການລຶບສິນຄ້ານີ້?")) try { await db.collection('products').doc(id).delete(); } catch(e){}
            };

            const handleAddExpense = async () => {
                if (!expenseForm.title || !expenseForm.amount) return alert("ກະລຸນາໃສ່ຫົວຂໍ້ ແລະ ຈຳນວນເງິນ");
                try {
                    await db.collection('expenses').add({
                        ...expenseForm,
                        amount: Number(expenseForm.amount),
                        createdAt: Date.now(),
                        timestamp: new Date().toLocaleString('lo-LA')
                    });
                    setIsExpenseModalOpen(false);
                    setExpenseForm({ title: '', amount: 0, note: '', category: 'ອື່ນໆ' });
                } catch(e) { alert(e.message); }
            };

            const handleDeleteExpense = async (id) => {
                if(confirm("ລຶບລາຍຈ່າຍນີ້?")) try { await db.collection('expenses').doc(id).delete(); } catch(e){}
            };

            const handleDeleteAllExpenses = async () => {
                if (!user) return;
                if (!confirm("⚠️ ຄຳເຕືອນ: ທ່ານຕ້ອງການລຶບປະຫວັດລາຍຈ່າຍທັງໝົດແທ້ບໍ?\nຂໍ້ມູນຈະຫາຍໄປຖາວອນ!")) return;
                const pwd = prompt("ກະລຸນາໃສ່ລະຫັດຢືນຢັນ (admin) ເພື່ອລຶບ:");
                if (pwd !== 'admin') return alert("ລະຫັດຜິດພາດ!");
                
                setLoading(true);
                try {
                    const snapshot = await db.collection('expenses').get();
                    if (snapshot.empty) { alert("ບໍ່ມີຂໍ້ມູນໃຫ້ລຶບ"); setLoading(false); return; }

                    const batchSize = 400; 
                    const chunks = [];
                    const docs = snapshot.docs;
                    
                    for (let i = 0; i < docs.length; i += batchSize) {
                        chunks.push(docs.slice(i, i + batchSize));
                    }

                    let deletedCount = 0;
                    for (const chunk of chunks) {
                        const batch = db.batch();
                        chunk.forEach(doc => batch.delete(doc.ref));
                        await batch.commit();
                        deletedCount += chunk.length;
                    }

                    alert(`ລຶບຂໍ້ມູນລາຍຈ່າຍທັງໝົດ ${deletedCount} ລາຍການສຳເລັດ!`);
                } catch (e) { 
                    console.error(e); 
                    alert("ເກີດຂໍ້ຜິດພາດ: " + e.message); 
                }
                setLoading(false);
            };

            const handleDeleteAllHistory = async () => {
                if (!user) return;
                if (!confirm("⚠️ ຄຳເຕືອນ: ທ່ານຕ້ອງການລຶບປະຫວັດການຂາຍທັງໝົດແທ້ບໍ?\nຂໍ້ມູນຈະຫາຍໄປຖາວອນ!")) return;
                const pwd = prompt("ກະລຸນາໃສ່ລະຫັດຢືນຢັນ (admin) ເພື່ອລຶບ:");
                if (pwd !== 'admin') return alert("ລະຫັດຜິດພາດ!");
                
                setLoading(true);
                try {
                    const snapshot = await db.collection('sales').get();
                    if (snapshot.empty) { alert("ບໍ່ມີຂໍ້ມູນໃຫ້ລຶບ"); setLoading(false); return; }

                    // 🔥 Fix: Chunk deletion (Firebase allows max 500 ops per batch)
                    const batchSize = 400; // Safe limit
                    const chunks = [];
                    const docs = snapshot.docs;
                    
                    for (let i = 0; i < docs.length; i += batchSize) {
                        chunks.push(docs.slice(i, i + batchSize));
                    }

                    let deletedCount = 0;
                    for (const chunk of chunks) {
                        const batch = db.batch();
                        chunk.forEach(doc => batch.delete(doc.ref));
                        await batch.commit();
                        deletedCount += chunk.length;
                    }

                    alert(`ລຶບຂໍ້ມູນທັງໝົດ ${deletedCount} ລາຍການສຳເລັດ!`);
                } catch (e) { 
                    console.error(e); 
                    alert("ເກີດຂໍ້ຜິດພາດ: " + e.message); 
                }
                setLoading(false);
            };

            const handleBulkUpdate = async () => {
                if (!bulkData.category || !bulkData.newRate) return alert("ຂໍ້ມູນບໍ່ຄົບ");
                if (!confirm(`ຢືນຢັນການປ່ຽນເລດ ${bulkData.category}?`)) return;
                setLoading(true);
                try {
                    const batch = db.batch();
                    products.filter(p => p.game === bulkData.category).forEach(doc => {
                        const newCost = doc.creditsUsed * bulkData.newRate;
                        batch.update(db.collection('products').doc(doc.id), { currentRate: Number(bulkData.newRate), cost: newCost, profit: doc.retail - newCost });
                    });
                    await batch.commit();
                    setIsBulkModalOpen(false);
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            // Derived Stats
            const totalSales = sales.reduce((a, b) => a + b.price, 0);
            const totalProfit = sales.reduce((a, b) => a + b.profit, 0);
            const totalExpenses = expenses.reduce((a, b) => a + b.amount, 0);
            const netProfit = totalProfit - totalExpenses;
            
            const categories = ['All', ...new Set(products.map(p => p.game))];

            // ດຶງຮູບອັດຕະໂນມັດມາເປັນໂລໂກ້ຂອງໝວດໝູ່
            const categoryImages = useMemo(() => {
                const map = {};
                products.forEach(p => {
                    if (p.imageUrl && !map[p.game]) map[p.game] = p.imageUrl;
                });
                return map;
            }, [products]);

            const sortedSalesProducts = useMemo(() => {
                let filtered = products.filter(p => (selectedCategory === 'All' || p.game === selectedCategory) && p.pack.toLowerCase().includes(searchTerm.toLowerCase()));
                return filtered.sort((a, b) => {
                    if (sortBy === 'name-asc') return a.pack.localeCompare(b.pack);
                    if (sortBy === 'price-asc') return a.retail - b.retail;
                    if (sortBy === 'price-desc') return b.retail - a.retail;
                    return 0;
                });
            }, [products, selectedCategory, searchTerm, sortBy]);

            // Daily Stats
            const dailyStats = useMemo(() => {
                const groups = {};
                sales.forEach(s => {
                    const date = new Date(s.createdAt).toLocaleDateString('en-GB'); 
                    if(!groups[date]) groups[date] = { date, sales: 0, profit: 0, count: 0, rawDate: s.createdAt };
                    groups[date].sales += s.price;
                    groups[date].profit += s.profit;
                    groups[date].count += 1;
                });
                return Object.values(groups).sort((a, b) => b.rawDate - a.rawDate);
            }, [sales]);

            if (authError) return <div className="h-screen flex items-center justify-center bg-red-50 text-red-600 p-10 font-bold">{authError}</div>;
            if (loading && !products.length) return <div className="h-screen flex items-center justify-center bg-indigo-50"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="flex min-h-screen bg-[#F3F4F6] font-sans text-slate-700">
                    
                    {/* Sidebar */}
                    <aside className="hidden md:flex w-72 flex-col fixed inset-y-0 bg-white border-r border-slate-200 z-20">
                        <div className="p-8 pb-4">
                            <div className="flex items-center gap-3 text-indigo-600 mb-2">
                                <div className="p-2 bg-indigo-100 rounded-xl"><Icon name="gamepad-2" size={24} /></div>
                                <span className="text-xl font-black tracking-tight text-slate-900">ສະຕ໋ອກລຸງແມັກ</span>
                            </div>
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-14">Management System</div>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-2">
                            {[
                                { id: 'dashboard', icon: 'layout-grid', label: 'ພາບລວມ' },
                                { id: 'sales', icon: 'shopping-cart', label: 'ຂາຍສິນຄ້າ' },
                                { id: 'stock', icon: 'package-search', label: 'ຄັງສິນຄ້າ' },
                                { id: 'expenses', icon: 'wallet', label: 'ລາຍຈ່າຍ' },
                                { id: 'daily', icon: 'calendar-check', label: 'ສະຫຼຸບຍອດ' },
                                { id: 'history', icon: 'history', label: 'ປະຫວັດ' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-sm font-bold transition-all duration-200 group ${
                                        activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'
                                    }`}>
                                    <Icon name={item.icon} size={20} className={activeTab === item.id ? 'text-indigo-100' : 'text-slate-400 group-hover:text-indigo-600'} />
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 md:ml-72 p-4 md:p-8 pb-32 md:pb-12 max-w-7xl mx-auto w-full">
                        <div className="md:hidden flex justify-between items-center mb-6 bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                            <span className="font-black text-lg text-slate-800 flex items-center gap-2"><Icon name="gamepad-2" className="text-indigo-600" /> GameStore</span>
                            <div className="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-xs">A</div>
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-enter">
                                <div><h1 className="text-2xl md:text-3xl font-black text-slate-900 mb-1">ສະບາຍດີ, Admin 👋</h1><p className="text-slate-500 text-sm">ນີ້ແມ່ນສະຖິຕິການຂາຍປະຈຳວັນຂອງທ່ານ</p></div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <StatCard label="ຍອດຂາຍລວມ" value={totalSales} icon="banknote" color="indigo" />
                                    <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex items-center gap-5 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="trending-up" size={100} /></div>
                                        <div className="w-14 h-14 rounded-2xl flex items-center justify-center bg-emerald-50 text-emerald-600"><Icon name="trending-up" size={28} /></div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">ກຳໄລສຸດທິ (Net Profit)</p>
                                            <div className="flex items-baseline gap-2">
                                                <p className="text-2xl font-black text-slate-800 mt-0.5">{formatNum(netProfit)}<span className="text-xs text-slate-400 font-bold ml-1">₭</span></p>
                                            </div>
                                            <p className="text-[10px] text-slate-400 mt-1">ຫັກລາຍຈ່າຍ {formatNum(totalExpenses)} ₭ ແລ້ວ</p>
                                        </div>
                                    </div>
                                    <StatCard label="ອໍເດີທັງໝົດ" value={sales.length} icon="shopping-bag" color="orange" isMoney={false} />
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
                                        <div className="flex items-center justify-between mb-6">
                                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="clock" size={18} className="text-indigo-500"/> ລາຍການລ່າສຸດ</h3>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-sm">
                                                <tbody className="divide-y divide-slate-50">
                                                    {sales.slice(0, 5).map(s => (
                                                        <tr key={s.id}>
                                                            <td className="py-4 pl-2 font-bold text-slate-700">{s.productName}</td>
                                                            <td className="py-4 text-right font-black text-slate-800">{formatNum(s.price)}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
                                        <div className="flex items-center justify-between mb-6">
                                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="wallet" size={18} className="text-red-500"/> ລາຍຈ່າຍລ່າສຸດ</h3>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-sm">
                                                <tbody className="divide-y divide-slate-50">

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1"><label className="text-xs font-bold text-indigo-400">Credits Used</label><input type="text" inputMode="decimal" placeholder="0.00" className="w-full bg-white rounded-xl p-3 font-bold text-lg text-slate-800 outline-none shadow-sm" value={formData.creditsUsed} onChange={e => { const val = e.target.value; if (/^[0-9]*[.,]?[0-9]*$/.test(val)) setFormData({...formData, creditsUsed: val}); }} /></div>
                                            <div className="space-y-1"><label className="text-xs font-bold text-indigo-400">Current Rate</label><input type="number" className="w-full bg-white rounded-xl p-3 font-bold text-lg text-slate-800 outline-none shadow-sm" value={formData.currentRate} onChange={e => setFormData({...formData, currentRate: Number(e.target.value)})} /></div>
                                        </div>
                                        <div className="flex justify-between items-center pt-2 border-t border-indigo-200/50"><span className="text-xs font-bold text-indigo-400">Calculated Cost</span><span className="text-2xl font-black text-indigo-700">{formatNum(formData.cost)}</span></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-xs font-bold text-slate-400 uppercase">Wholesale Price</label><input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-indigo-500" value={formData.wholesale} onChange={e => setFormData({...formData, wholesale: Number(e.target.value)})} /></div>
                                        <div className="space-y-1"><label className="text-xs font-bold text-slate-400 uppercase">Retail Price</label><input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-indigo-500" value={formData.retail} onChange={e => setFormData({...formData, retail: Number(e.target.value)})} /></div>
                                    </div>
                                    <button onClick={handleProductSave} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-xl shadow-slate-300 hover:bg-indigo-600 transition-all active:scale-95">ບັນທຶກຂໍ້ມູນ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: BULK EDIT RATE */}
                    {isBulkModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-enter">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl relative">
                                <button onClick={() => setIsBulkModalOpen(false)} className="absolute top-6 right-6 p-2 bg-slate-100 rounded-full hover:bg-slate-200"><Icon name="x" size={20}/></button>
                                <div className="mb-6"><h2 className="text-2xl font-black text-slate-900">ປ່ຽນເລດຍົກໝວດ</h2><p className="text-slate-500 text-sm mt-1">ລະບົບຈະຄິດໄລ່ຕົ້ນທຶນໃໝ່.</p></div>
                                <div className="space-y-4">
                                    <div className="space-y-2"><label className="text-xs font-bold text-slate-400 uppercase ml-1">ເລືອກໝວດໝູ່</label><div className="flex flex-wrap gap-2">{categories.filter(c => c !== 'All').map(c => (<button key={c} onClick={() => setBulkData({...bulkData, category: c})} className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${bulkData.category === c ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200 hover:border-indigo-300'}`}>{c}</button>))}</div></div>
                                    <div className="space-y-2"><label className="text-xs font-bold text-slate-400 uppercase ml-1">ປ້ອນເລດໃໝ່</label><input type="number" placeholder="ຕົວຢ່າງ: 420" className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-4 font-black text-xl text-center text-slate-800 outline-none focus:border-indigo-500 transition-all" value={bulkData.newRate} onChange={e => setBulkData({...bulkData, newRate: e.target.value})} /></div>
                                    <button onClick={handleBulkUpdate} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-95 flex justify-center items-center gap-2">ອັບເດດທັງໝົດ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADD EXPENSE */}
                    {isExpenseModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-enter">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setIsExpenseModalOpen(false)} className="absolute top-6 right-6 p-2 bg-slate-100 rounded-full hover:bg-slate-200"><Icon name="x" size={20}/></button>
                                <div className="mb-6"><h2 className="text-2xl font-black text-slate-900">ເພີ່ມລາຍຈ່າຍ</h2><p className="text-slate-500 text-sm mt-1">ບັນທຶກຄ່າໃຊ້ຈ່າຍໃໝ່</p></div>
                                <div className="space-y-4">
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-400 uppercase">ໝວດໝູ່ (Category)</label>
                                        <div className="flex flex-wrap gap-2 mb-2">
                                            {expenseCategories.map(c => (
                                                <button key={c} onClick={() => setExpenseForm({...expenseForm, category: c})} className={`text-[10px] px-3 py-1.5 rounded-lg font-bold transition-colors ${expenseForm.category === c ? 'bg-red-500 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600'}`}>{c}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="space-y-1"><label className="text-xs font-bold text-slate-400 uppercase">ຫົວຂໍ້ (Title)</label><input className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.title} onChange={e => setExpenseForm({...expenseForm, title: e.target.value})} placeholder="ຕົວຢ່າງ: ຄ່າເນັດ..." /></div>
                                    <div className="space-y-1"><label className="text-xs font-bold text-slate-400 uppercase">ຈຳນວນເງິນ (Amount)</label><input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-xs font-bold text-slate-400 uppercase">ໝາຍເຫດ (Note)</label><input className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-medium text-slate-600 outline-none focus:border-red-500" value={expenseForm.note} onChange={e => setExpenseForm({...expenseForm, note: e.target.value})} /></div>
                                    <button onClick={handleAddExpense} className="w-full bg-red-500 text-white py-4 rounded-xl font-bold shadow-lg shadow-red-200 hover:bg-red-600 transition-all active:scale-95">ບັນທຶກລາຍຈ່າຍ</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StatCard = ({ label, value, icon, color, isMoney = true }) => {
            const colors = { indigo: 'bg-indigo-50 text-indigo-600', emerald: 'bg-emerald-50 text-emerald-600', orange: 'bg-orange-50 text-orange-600' };
            return (
                <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex items-center gap-5">
                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${colors[color]}`}><Icon name={icon} size={28} /></div>
                    <div><p className="text-xs font-bold text-slate-400 uppercase tracking-wider">{label}</p><p className="text-2xl font-black text-slate-800 mt-0.5">{formatNum(value)}{isMoney && <span className="text-xs text-slate-400 font-bold ml-1">₭</span>}</p></div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
