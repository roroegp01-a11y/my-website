<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ສະຕ໋ອກເຄື່ອງລຸງແມັກ - Cloud POS</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans Lao', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#7c3aed', // Violet 600
                        dark: '#0f172a',
                        surface: '#ffffff',
                        background: '#f8fafc' // Slate 50
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 20px rgba(79, 70, 229, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Noto Sans Lao', sans-serif; background-color: #f8fafc; color: #334155; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-enter { animation: enter 0.3s ease-out forwards; }
        @keyframes enter { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        /* Custom scrollbar for tables */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-700">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA0XqpDeXRcmePJ0wEVj5UixJg0PzO_tKY",
            authDomain: "stock-ac1c3.firebaseapp.com",
            projectId: "stock-ac1c3",
            storageBucket: "stock-ac1c3.firebasestorage.app",
            messagingSenderId: "31846633000",
            appId: "1:31846633000:web:54bf0ee62f9f6109d7ef1d",
            measurementId: "G-8G7NY8CK23"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const formatNum = (num) => Number(num || 0).toLocaleString('en-US');

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [expenses, setExpenses] = useState([]); 
            
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [sortBy, setSortBy] = useState('name-asc');
            
            // Filters
            const [selectedCategory, setSelectedCategory] = useState('All'); 
            const [stockCategory, setStockCategory] = useState('All'); 
            
            // Performance UI States (Pagination Limits)
            const [visibleHistory, setVisibleHistory] = useState(50);
            const [visibleExpenses, setVisibleExpenses] = useState(50);

            // Modals State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isBulkModalOpen, setIsBulkModalOpen] = useState(false);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null });
            const [editingProduct, setEditingProduct] = useState(null);
            
            // Form Data
            const [formData, setFormData] = useState({ 
                game: 'ML', pack: '', cost: 0, wholesale: 0, retail: 0, creditsUsed: 0, currentRate: 410, imageUrl: ''
            });
            const [bulkData, setBulkData] = useState({ category: '', newRate: 0 });
            const [expenseForm, setExpenseForm] = useState({ title: '', amount: 0, note: '', category: 'ອື່ນໆ' });

            const expenseCategories = ['ຄ່າອາຫານ', 'ຄ່າເນັດ', 'ຄ່າໄຟ', 'ຄ່ານ້ຳ', 'ຄ່າເຊົ່າຮ້ານ', 'ເງິນເດືອນ', 'ຊື້ເຄື່ອງໃຊ້', 'ອື່ນໆ'];

            const showDialog = (type, message, onConfirm = null) => setDialog({ isOpen: true, type, message, inputValue: '', onConfirm });
            const closeDialog = () => setDialog(prev => ({ ...prev, isOpen: false }));

            // Auth & Initial Load
            useEffect(() => {
                auth.signInAnonymously().catch(e => setAuthError(e.message));
                return auth.onAuthStateChanged(u => {
                    if(u) { setUser(u); setAuthError(null); }
                });
            }, []);

            // Data Sync
            useEffect(() => {
                if (!user) return;
                
                const unsubProd = db.collection('products').onSnapshot(s => {
                    setProducts(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });
                
                const unsubSales = db.collection('sales').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setSales(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubExp = db.collection('expenses').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setExpenses(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => { unsubProd(); unsubSales(); unsubExp(); };
            }, [user]);

            // Auto Calculate Cost in Form
            useEffect(() => {
                const parseVal = (val) => {
                    if (!val) return 0;
                    if (typeof val === 'number') return val;
                    return Number(val.replace(',', '.'));
                };
                const credits = parseVal(formData.creditsUsed);
                const rate = parseVal(formData.currentRate);
                const cost = credits * rate;
                if (cost >= 0 && cost !== formData.cost) setFormData(prev => ({ ...prev, cost }));
            }, [formData.creditsUsed, formData.currentRate]);

            // Handlers
            const handleMakeSale = async (product, type) => {
                if (!user) return;
                const price = type === 'retail' ? product.retail : product.wholesale;
                try {
                    await db.collection('sales').add({
                        productName: `${product.game} - ${product.pack}`,
                        price, profit: price - product.cost, type, creditsUsed: product.creditsUsed || 0,
                        createdAt: Date.now(), timestamp: new Date().toLocaleString('lo-LA')
                    });
                } catch (err) { showDialog('alert', err.message); }
            };

            const handleDeleteSale = (id) => {
                showDialog('confirm', "ຕ້ອງການລຶບລາຍການຂາຍນີ້ບໍ?", async () => {
                    try { await db.collection('sales').doc(id).delete(); } 
                    catch(e) { showDialog('alert', "ເກີດຂໍ້ຜິດພາດ: " + e.message); }
                });
            };

            const handleProductSave = async () => {
                if(!user) return;
                const finalCredits = typeof formData.creditsUsed === 'string' ? parseFloat(formData.creditsUsed.replace(',', '.')) : formData.creditsUsed;
                const data = { ...formData, creditsUsed: finalCredits || 0, profit: formData.retail - formData.cost, createdAt: Date.now() };

                try {
                    if (editingProduct) await db.collection('products').doc(editingProduct.id).update(data);
                    else await db.collection('products').add(data);
                    setIsModalOpen(false);
                } catch(e) { showDialog('alert', e.message); }
            };

            const handleProductDelete = (id) => {
                showDialog('confirm', "ຢືນຢັນການລຶບສິນຄ້ານີ້?", async () => {
                    try { await db.collection('products').doc(id).delete(); } catch(e){ showDialog('alert', e.message); }
                });
            };

            const handleAddExpense = async () => {
                if (!expenseForm.title || !expenseForm.amount) return showDialog('alert', "ກະລຸນາໃສ່ຫົວຂໍ້ ແລະ ຈຳນວນເງິນ");
                try {
                    await db.collection('expenses').add({
                        ...expenseForm, amount: Number(expenseForm.amount), createdAt: Date.now(), timestamp: new Date().toLocaleString('lo-LA')
                    });
                    setIsExpenseModalOpen(false);
                    setExpenseForm({ title: '', amount: 0, note: '', category: 'ອື່ນໆ' });
                } catch(e) { showDialog('alert', e.message); }
            };

            const handleDeleteExpense = (id) => {
                showDialog('confirm', "ລຶບລາຍຈ່າຍນີ້?", async () => {
                    try { await db.collection('expenses').doc(id).delete(); } catch(e){ showDialog('alert', e.message); }
                });
            };

            const handleDeleteAllExpenses = () => {
                if (!user) return;
                showDialog('confirm', "⚠️ ຄຳເຕືອນ: ທ່ານຕ້ອງການລຶບປະຫວັດລາຍຈ່າຍທັງໝົດແທ້ບໍ?\nຂໍ້ມູນຈະຫາຍໄປຖາວອນ!", () => {
                    showDialog('prompt', "ກະລຸນາໃສ່ລະຫັດຢືນຢັນ (admin) ເພື່ອລຶບ:", async (pwd) => {
                        if (pwd !== 'admin') return showDialog('alert', "ລະຫັດຜິດພາດ!");
                        setLoading(true);
                        try {
                            const snapshot = await db.collection('expenses').get();
                            if (snapshot.empty) { showDialog('alert', "ບໍ່ມີຂໍ້ມູນໃຫ້ລຶບ"); setLoading(false); return; }
                            const chunks = [];
                            for (let i = 0; i < snapshot.docs.length; i += 400) chunks.push(snapshot.docs.slice(i, i + 400));
                            let deletedCount = 0;
                            for (const chunk of chunks) {
                                const batch = db.batch();
                                chunk.forEach(doc => batch.delete(doc.ref));
                                await batch.commit();
                                deletedCount += chunk.length;
                            }
                            showDialog('alert', `ລຶບຂໍ້ມູນລາຍຈ່າຍທັງໝົດ ${deletedCount} ລາຍການສຳເລັດ!`);
                        } catch (e) { showDialog('alert', "ເກີດຂໍ້ຜິດພາດ: " + e.message); }
                        setLoading(false);
                    });
                });
            };

            const handleDeleteAllHistory = () => {
                if (!user) return;
                showDialog('confirm', "⚠️ ຄຳເຕືອນ: ທ່ານຕ້ອງການລຶບປະຫວັດການຂາຍທັງໝົດແທ້ບໍ?\nຂໍ້ມູນຈະຫາຍໄປຖາວອນ!", () => {
                    showDialog('prompt', "ກະລຸນາໃສ່ລະຫັດຢືນຢັນ (admin) ເພື່ອລຶບ:", async (pwd) => {
                        if (pwd !== 'admin') return showDialog('alert', "ລະຫັດຜິດພາດ!");
                        setLoading(true);
                        try {
                            const snapshot = await db.collection('sales').get();
                            if (snapshot.empty) { showDialog('alert', "ບໍ່ມີຂໍ້ມູນໃຫ້ລຶບ"); setLoading(false); return; }
                            const chunks = [];
                            for (let i = 0; i < snapshot.docs.length; i += 400) chunks.push(snapshot.docs.slice(i, i + 400));
                            let deletedCount = 0;
                            for (const chunk of chunks) {
                                const batch = db.batch();
                                chunk.forEach(doc => batch.delete(doc.ref));
                                await batch.commit();
                                deletedCount += chunk.length;
                            }
                            showDialog('alert', `ລຶບຂໍ້ມູນທັງໝົດ ${deletedCount} ລາຍການສຳເລັດ!`);
                        } catch (e) { showDialog('alert', "ເກີດຂໍ້ຜິດພາດ: " + e.message); }
                        setLoading(false);
                    });
                });
            };

            const handleBulkUpdate = async () => {
                if (!bulkData.category || !bulkData.newRate) return showDialog('alert', "ຂໍ້ມູນບໍ່ຄົບ");
                showDialog('confirm', `ຢືນຢັນການປ່ຽນເລດ ${bulkData.category}?`, async () => {
                    setLoading(true);
                    try {
                        const batch = db.batch();
                        products.filter(p => p.game === bulkData.category).forEach(doc => {
                            const newCost = doc.creditsUsed * bulkData.newRate;
                            batch.update(db.collection('products').doc(doc.id), { currentRate: Number(bulkData.newRate), cost: newCost, profit: doc.retail - newCost });
                        });
                        await batch.commit();
                        setIsBulkModalOpen(false);
                        showDialog('alert', "ອັບເດດເລດສຳເລັດ!");
                    } catch (e) { showDialog('alert', e.message); }
                    setLoading(false);
                });
            };

            // Derived Stats
            const totalSales = sales.reduce((a, b) => a + b.price, 0);
            const totalProfit = sales.reduce((a, b) => a + b.profit, 0);
            const totalExpenses = expenses.reduce((a, b) => a + b.amount, 0);
            const netProfit = totalProfit - totalExpenses;
            
            const categories = ['All', ...new Set(products.map(p => p.game))];

            const categoryImages = useMemo(() => {
                const map = {};
                products.forEach(p => { if (p.imageUrl && !map[p.game]) map[p.game] = p.imageUrl; });
                return map;
            }, [products]);

            const sortedSalesProducts = useMemo(() => {
                let filtered = products.filter(p => (selectedCategory === 'All' || p.game === selectedCategory) && p.pack.toLowerCase().includes(searchTerm.toLowerCase()));
                return filtered.sort((a, b) => {
                    if (sortBy === 'name-asc') return a.pack.localeCompare(b.pack);
                    if (sortBy === 'price-asc') return a.retail - b.retail;
                    if (sortBy === 'price-desc') return b.retail - a.retail;
                    return 0;
                });
            }, [products, selectedCategory, searchTerm, sortBy]);

            const dailyStats = useMemo(() => {
                const groups = {};
                sales.forEach(s => {
                    const date = new Date(s.createdAt).toLocaleDateString('en-GB'); 
                    if(!groups[date]) groups[date] = { date, sales: 0, profit: 0, count: 0, rawDate: s.createdAt };
                    groups[date].sales += s.price;
                    groups[date].profit += s.profit;
                    groups[date].count += 1;
                });
                return Object.values(groups).sort((a, b) => b.rawDate - a.rawDate);
            }, [sales]);

            const topSellingProducts = useMemo(() => {
                const counts = {};
                sales.forEach(sale => {
                    if (!counts[sale.productName]) counts[sale.productName] = { name: sale.productName, count: 0 };
                    counts[sale.productName].count += 1;
                });
                return Object.values(counts).sort((a, b) => b.count - a.count).slice(0, 5);
            }, [sales]);

            if (authError) return <div className="h-screen flex items-center justify-center bg-red-50 text-red-600 p-10 font-bold">{authError}</div>;
            if (loading && !products.length) return <div className="h-screen flex items-center justify-center bg-[#f8fafc]"><div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div></div>;

            return (
                <div className="flex min-h-screen">
                    
                    {/* Sidebar - Modernized */}
                    <aside className="hidden md:flex w-[260px] flex-col fixed inset-y-0 bg-white border-r border-slate-200/60 z-20 shadow-sm">
                        <div className="p-6 pb-2">
                            <div className="flex items-center gap-3 text-indigo-600 mb-1">
                                <div className="p-2.5 bg-indigo-50 rounded-xl"><Icon name="boxes" size={22} /></div>
                                <span className="text-[1.15rem] font-extrabold tracking-tight text-slate-800">ລຸງແມັກສະຕ໋ອກ</span>
                            </div>
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-14">Cloud POS System</div>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scroll">
                            {[
                                { id: 'dashboard', icon: 'layout-dashboard', label: 'ພາບລວມ' },
                                { id: 'sales', icon: 'shopping-cart', label: 'ຂາຍສິນຄ້າ' },
                                { id: 'stock', icon: 'package', label: 'ຄັງສິນຄ້າ' },
                                { id: 'expenses', icon: 'wallet', label: 'ລາຍຈ່າຍ' },
                                { id: 'daily', icon: 'bar-chart-3', label: 'ສະຫຼຸບຍອດ' },
                                { id: 'history', icon: 'history', label: 'ປະຫວັດ' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all duration-200 group ${
                                        activeTab === item.id ? 'bg-indigo-600 text-white shadow-glow' : 'text-slate-500 hover:bg-slate-50 hover:text-indigo-600'
                                    }`}>
                                    <Icon name={item.icon} size={18} className={activeTab === item.id ? 'text-white' : 'text-slate-400 group-hover:text-indigo-600'} />
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-100">
                            <div className="flex items-center gap-3 px-2 py-2">
                                <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold text-xs border border-slate-200">A</div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-sm font-bold text-slate-700 truncate">ຜູ້ເບິ່ງແຍງລະບົບ</p>
                                    <p className="text-[10px] text-emerald-500 font-bold flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 md:ml-[260px] p-4 md:p-8 pb-32 md:pb-12 max-w-[1400px] mx-auto w-full relative">
                        {/* Mobile Header */}
                        <div className="md:hidden flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-soft border border-slate-100">
                            <span className="font-extrabold text-lg text-slate-800 flex items-center gap-2"><div className="p-1.5 bg-indigo-50 rounded-lg text-indigo-600"><Icon name="boxes" size={20} /></div> ລຸງແມັກສະຕ໋ອກ</span>
                            <div className="w-8 h-8 bg-slate-100 border border-slate-200 rounded-full flex items-center justify-center text-slate-600 font-bold text-xs">A</div>
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-enter">
                                <div><h1 className="text-2xl font-extrabold text-slate-800 mb-1">ສະບາຍດີ, ແອັດມິນ 👋</h1><p className="text-slate-500 text-sm">ພາບລວມທຸລະກິດ ແລະ ສະຖິຕິການຂາຍຂອງທ່ານ.</p></div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                    <StatCard label="ຍອດຂາຍລວມ" value={totalSales} icon="banknote" color="indigo" />
                                    
                                    {/* Modern Gradient Profit Card */}
                                    <div className="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-[1.5rem] shadow-lg flex items-center gap-5 relative overflow-hidden group">
                                        <div className="absolute -right-4 -top-4 w-32 h-32 bg-white/5 rounded-full blur-2xl group-hover:bg-white/10 transition-colors"></div>
                                        <div className="w-12 h-12 rounded-xl flex items-center justify-center bg-white/10 text-emerald-400 backdrop-blur-sm border border-white/10"><Icon name="trending-up" size={24} /></div>
                                        <div className="relative z-10">
                                            <p className="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">ກຳໄລສຸດທິ (Net Profit)</p>
                                            <div className="flex items-baseline gap-1.5">
                                                <p className="text-2xl font-black text-white">{formatNum(netProfit)}</p><span className="text-sm text-slate-400 font-bold">₭</span>
                                            </div>
                                            <p className="text-[10px] text-slate-400 mt-1.5 bg-white/5 inline-block px-2 py-0.5 rounded-full">ຫັກລາຍຈ່າຍ {formatNum(totalExpenses)} ₭ ແລ້ວ</p>
                                        </div>
                                    </div>
                                    
                                    <StatCard label="ຈຳນວນອໍເດີທັງໝົດ" value={sales.length} icon="shopping-bag" color="orange" isMoney={false} />
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                                    <div className="bg-white rounded-[1.5rem] p-6 shadow-soft border border-slate-100 flex flex-col">
                                        <div className="flex items-center justify-between mb-5">

                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <h2 className="text-2xl font-extrabold text-slate-800">ປະຫວັດການຂາຍ</h2>
                                    <button onClick={handleDeleteAllHistory} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-white text-rose-600 border border-rose-200 px-4 py-2.5 rounded-xl font-bold text-xs hover:bg-rose-50 transition-all"><Icon name="trash-2" size={16}/> ລຶບປະຫວັດທັງໝົດ</button>
                                </div>
                                <div className="bg-white rounded-[1.5rem] border border-slate-200 overflow-hidden shadow-soft">
                                    <div className="overflow-x-auto custom-scroll">
                                        <table className="w-full text-left whitespace-nowrap">
                                            <thead className="bg-slate-50/80 text-[11px] uppercase text-slate-500 font-bold border-b border-slate-200">
                                                <tr><th className="px-5 py-4">ເວລາ</th><th className="px-5 py-4">ລາຍການ</th><th className="px-5 py-4 text-right">ລາຄາຂາຍ</th><th className="px-5 py-4 text-right">ກຳໄລ</th><th className="px-5 py-4 text-center">ລຶບ</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {sales.slice(0, visibleHistory).map(s => (
                                                    <tr key={s.id} className="hover:bg-slate-50/50 transition-colors">
                                                        <td className="px-5 py-3 text-slate-400 font-medium text-[11px]">{s.timestamp}</td>
                                                        <td className="px-5 py-3 font-semibold text-slate-800">
                                                            {s.productName}
                                                            <span className={`ml-2 text-[9px] px-1.5 py-0.5 rounded uppercase font-bold border ${s.type === 'retail' ? 'bg-indigo-50 text-indigo-600 border-indigo-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100'}`}>{s.type}</span>
                                                        </td>
                                                        <td className="px-5 py-3 text-right font-bold text-slate-900">{formatNum(s.price)}</td>
                                                        <td className="px-5 py-3 text-right font-black text-emerald-500">+{formatNum(s.profit)}</td>
                                                        <td className="px-5 py-3 text-center">
                                                            <button onClick={() => handleDeleteSale(s.id)} className="text-slate-300 hover:text-rose-500 p-1.5 rounded-md hover:bg-rose-50 transition-colors"><Icon name="trash-2" size={16}/></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {sales.length === 0 && <tr><td colSpan="5" className="py-12 text-center text-slate-400 font-medium">ຍັງບໍ່ມີປະຫວັດການຂາຍ</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                    {/* Pagination for Performance */}
                                    {sales.length > visibleHistory && (
                                        <div className="p-4 bg-white border-t border-slate-100 flex justify-center">
                                            <button onClick={() => setVisibleHistory(prev => prev + 50)} className="px-6 py-2 bg-slate-50 text-slate-600 font-bold text-xs rounded-xl border border-slate-200 hover:bg-slate-100 transition-colors">ໂຫຼດເພີ່ມເຕີມ ({sales.length - visibleHistory})</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-4 left-4 right-4 bg-white/90 backdrop-blur-xl border border-slate-200/50 p-2 rounded-2xl shadow-xl flex justify-between items-center z-40">
                        {['dashboard', 'sales', 'stock', 'expenses', 'history'].map(tab => (
                            <button key={tab} onClick={() => setActiveTab(tab)} className={`p-2.5 rounded-xl transition-all flex flex-col items-center gap-1 w-full ${activeTab === tab ? 'text-indigo-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                <div className={`${activeTab === tab ? 'bg-indigo-50 p-1.5 rounded-lg' : ''}`}>
                                    <Icon name={tab === 'dashboard' ? 'layout-dashboard' : tab === 'sales' ? 'shopping-cart' : tab === 'stock' ? 'package' : tab === 'expenses' ? 'wallet' : 'history'} size={22} />
                                </div>
                                {activeTab === tab && <div className="w-1 h-1 rounded-full bg-indigo-600 absolute bottom-1"></div>}
                            </button>
                        ))}
                    </div>

                    {/* Custom Dialog */}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-enter">
                            <div className="bg-white rounded-[1.5rem] p-6 shadow-2xl max-w-sm w-full border border-slate-100">
                                <h3 className="text-[1.15rem] font-extrabold text-slate-900 mb-2">
                                    {dialog.type === 'alert' ? 'ແຈ້ງເຕືອນ' : dialog.type === 'confirm' ? 'ຢືນຢັນການເຮັດວຽກ' : 'ຕ້ອງການລະຫັດຜ່ານ'}
                                </h3>
                                <p className="text-slate-500 text-sm mb-6 whitespace-pre-wrap">{dialog.message}</p>
                                
                                {dialog.type === 'prompt' && (
                                    <input type="password" autoFocus className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-indigo-500 mb-5" value={dialog.inputValue} onChange={e => setDialog({...dialog, inputValue: e.target.value})} placeholder="ໃສ່ລະຫັດ..." />
                                )}
                                
                                <div className="flex justify-end gap-2.5">
                                    {dialog.type !== 'alert' && <button onClick={closeDialog} className="px-4 py-2 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors text-sm">ຍົກເລີກ</button>}
                                    <button onClick={() => { 
                                        const { type, onConfirm, inputValue } = dialog;
                                        closeDialog(); // ປິດກ່ອງເກົ່າກ່ອນ
                                        if (type === 'prompt') {
                                            onConfirm && onConfirm(inputValue); // ແລ້ວຈຶ່ງສັ່ງເປີດກ່ອງໃໝ່
                                        } else {
                                            onConfirm && onConfirm();
                                        }
                                    }} className="px-5 py-2 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors shadow-md text-sm">ຕົກລົງ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Product */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-enter">
                            <div className="bg-white w-full max-w-lg rounded-[1.5rem] p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scroll border border-slate-100">
                                <button onClick={() => setIsModalOpen(false)} className="absolute top-5 right-5 p-2 text-slate-400 bg-slate-50 rounded-full hover:bg-slate-100 hover:text-slate-600 transition-colors"><Icon name="x" size={18}/></button>
                                <h2 className="text-xl font-extrabold text-slate-900 mb-5">{editingProduct ? 'ແກ້ໄຂສິນຄ້າ' : 'ເພີ່ມສິນຄ້າໃໝ່'}</h2>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Game</label>
                                            <input list="game-options" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-sm text-slate-700 outline-none focus:border-indigo-500 transition-colors" value={formData.game} onChange={e => setFormData({...formData, game: e.target.value})} placeholder="ເລືອກ ຫຼື ພິມ..." />
                                            <datalist id="game-options">{categories.filter(c => c !== 'All').map(c => <option key={c} value={c} />)}</datalist>
                                            <div className="flex flex-wrap gap-1 mt-1.5">{categories.filter(c => c !== 'All').map(c => (<button key={c} onClick={() => setFormData({...formData, game: c})} className="text-[9px] px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-500 font-bold hover:bg-indigo-100 hover:text-indigo-600 transition-colors">{c}</button>))}</div>
                                        </div>
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">ຊື່ແພັກ (Pack Name)</label><input className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-sm text-slate-700 outline-none focus:border-indigo-500 transition-colors" value={formData.pack} onChange={e => setFormData({...formData, pack: e.target.value})} /></div>
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">ລິ້ງຮູບພາບ (ໃສ່ ຫຼື ບໍ່ໃສ່ກໍໄດ້)</label>
                                        <div className="flex gap-2">
                                            <input className="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-medium text-sm text-slate-600 outline-none focus:border-indigo-500 transition-colors" value={formData.imageUrl || ''} onChange={e => setFormData({...formData, imageUrl: e.target.value})} placeholder="https://..." />
                                            {formData.imageUrl && <img src={formData.imageUrl} alt="preview" className="w-10 h-10 rounded-lg object-cover border border-slate-200 shadow-sm" />}
                                        </div>
                                    </div>

                                    <div className="bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100 space-y-3">
                                        <div className="flex items-center gap-1.5 text-indigo-600 text-[10px] font-black uppercase tracking-wider"><Icon name="calculator" size={14}/> ຄິດໄລ່ຕົ້ນທຶນອັດຕະໂນມັດ</div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1"><label className="text-[10px] font-bold text-indigo-500">ຈຳນວນເຄຣດິດ</label><input type="text" inputMode="decimal" placeholder="0.00" className="w-full bg-white border border-indigo-100/50 rounded-xl p-2.5 font-black text-slate-800 outline-none focus:border-indigo-400" value={formData.creditsUsed} onChange={e => { const val = e.target.value; if (/^[0-9]*[.,]?[0-9]*$/.test(val)) setFormData({...formData, creditsUsed: val}); }} /></div>
                                            <div className="space-y-1"><label className="text-[10px] font-bold text-indigo-500">ເລດປັດຈຸບັນ (Rate)</label><input type="number" className="w-full bg-white border border-indigo-100/50 rounded-xl p-2.5 font-black text-slate-800 outline-none focus:border-indigo-400" value={formData.currentRate} onChange={e => setFormData({...formData, currentRate: Number(e.target.value)})} /></div>
                                        </div>
                                        <div className="flex justify-between items-center pt-2 border-t border-indigo-200/50"><span className="text-[10px] font-bold text-indigo-500">ຕົ້ນທຶນລວມ</span><span className="text-xl font-black text-indigo-700">{formatNum(formData.cost)}</span></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">ລາຄາສົ່ງ</label><input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-800 outline-none focus:border-indigo-500" value={formData.wholesale} onChange={e => setFormData({...formData, wholesale: Number(e.target.value)})} /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">ລາຄາຂາຍຍ່ອຍ</label><input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-800 outline-none focus:border-indigo-500" value={formData.retail} onChange={e => setFormData({...formData, retail: Number(e.target.value)})} /></div>
                                    </div>
                                    <button onClick={handleProductSave} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-md shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-95 text-sm mt-2">ບັນທຶກຂໍ້ມູນ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Bulk Edit */}
                    {isBulkModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-enter">
                            <div className="bg-white w-full max-w-sm rounded-[1.5rem] p-6 shadow-2xl relative border border-slate-100">
                                <button onClick={() => setIsBulkModalOpen(false)} className="absolute top-5 right-5 p-2 text-slate-400 bg-slate-50 rounded-full hover:bg-slate-100 hover:text-slate-600 transition-colors"><Icon name="x" size={18}/></button>
                                <div className="mb-5"><h2 className="text-xl font-extrabold text-slate-900">ປ່ຽນເລດຍົກໝວດ</h2><p className="text-slate-500 text-xs mt-1">ລະບົບຈະຄິດໄລ່ຕົ້ນທຶນໃໝ່ອັດຕະໂນມັດ</p></div>
                                <div className="space-y-4">
                                    <div className="space-y-1.5"><label className="text-[10px] font-bold text-slate-500 uppercase">ເລືອກໝວດໝູ່</label><div className="flex flex-wrap gap-1.5">{categories.filter(c => c !== 'All').map(c => (<button key={c} onClick={() => setBulkData({...bulkData, category: c})} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-all ${bulkData.category === c ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}`}>{c}</button>))}</div></div>
                                    <div className="space-y-1.5"><label className="text-[10px] font-bold text-slate-500 uppercase">ປ້ອນເລດໃໝ່</label><input type="number" placeholder="ຕົວຢ່າງ: 420" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-black text-lg text-center text-slate-800 outline-none focus:border-indigo-500 focus:bg-white transition-colors" value={bulkData.newRate} onChange={e => setBulkData({...bulkData, newRate: e.target.value})} /></div>
                                    <button onClick={handleBulkUpdate} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold shadow-md hover:bg-slate-800 transition-all active:scale-95 flex justify-center items-center gap-2 text-sm">ອັບເດດທັງໝົດ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add Expense */}
                    {isExpenseModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-enter">
                            <div className="bg-white w-full max-w-sm rounded-[1.5rem] p-6 shadow-2xl relative border border-slate-100">
                                <button onClick={() => setIsExpenseModalOpen(false)} className="absolute top-5 right-5 p-2 text-slate-400 bg-slate-50 rounded-full hover:bg-slate-100 hover:text-slate-600 transition-colors"><Icon name="x" size={18}/></button>
                                <div className="mb-5"><h2 className="text-xl font-extrabold text-slate-900">ເພີ່ມລາຍຈ່າຍ</h2><p className="text-slate-500 text-xs mt-1">ບັນທຶກຄ່າໃຊ້ຈ່າຍໃໝ່</p></div>
                                <div className="space-y-3">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">ໝວດໝູ່</label>
                                        <div className="flex flex-wrap gap-1.5 mb-1">
                                            {expenseCategories.map(c => (
                                                <button key={c} onClick={() => setExpenseForm({...expenseForm, category: c})} className={`text-[10px] px-2.5 py-1 rounded-md font-bold transition-colors ${expenseForm.category === c ? 'bg-rose-500 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-rose-100 hover:text-rose-600'}`}>{c}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">ຫົວຂໍ້</label><input className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-sm text-slate-700 outline-none focus:border-rose-500 transition-colors" value={expenseForm.title} onChange={e => setExpenseForm({...expenseForm, title: e.target.value})} placeholder="ຕົວຢ່າງ: ຄ່າເນັດ..." /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">ຈຳນວນເງິນ</label><input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-black text-sm text-slate-800 outline-none focus:border-rose-500 transition-colors" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">ໝາຍເຫດ</label><input className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-medium text-sm text-slate-600 outline-none focus:border-rose-500 transition-colors" value={expenseForm.note} onChange={e => setExpenseForm({...expenseForm, note: e.target.value})} /></div>
                                    <button onClick={handleAddExpense} className="w-full bg-rose-500 text-white py-3 rounded-xl font-bold shadow-md shadow-rose-200 hover:bg-rose-600 transition-all active:scale-95 text-sm mt-2">ບັນທຶກລາຍຈ່າຍ</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StatCard = ({ label, value, icon, color, isMoney = true }) => {
            const colors = { 
                indigo: 'bg-indigo-50 text-indigo-600', 
                emerald: 'bg-emerald-50 text-emerald-600', 
                orange: 'bg-orange-50 text-orange-600' 
            };
            return (
                <div className="bg-white p-6 rounded-[1.5rem] border border-slate-100 shadow-soft flex items-center gap-4">
                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${colors[color]}`}><Icon name={icon} size={24} /></div>
                    <div><p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{label}</p><p className="text-2xl font-extrabold text-slate-800 mt-0.5">{formatNum(value)}{isMoney && <span className="text-sm text-slate-400 font-bold ml-1">₭</span>}</p></div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
