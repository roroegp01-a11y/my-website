<!DOCTYPE html>
<html lang="lo">
<head>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700;800;900&display=swap');
        body { 
            font-family: 'Noto Sans Lao', sans-serif; 
            background: radial-gradient(circle at top right, #e0e7ff, #f3e8ff, #fce7f3, #ffffff);
            background-attachment: fixed;
            color: #334155; 
        }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(100, 110, 140, 0.05);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; border: 2px solid transparent; background-clip: padding-box; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box; }
    </style>
</head>
<body class="antialiased selection:bg-pink-200 selection:text-pink-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA0XqpDeXRcmePJ0wEVj5UixJg0PzO_tKY",
            authDomain: "stock-ac1c3.firebaseapp.com",
            projectId: "stock-ac1c3",
            storageBucket: "stock-ac1c3.firebasestorage.app",
            messagingSenderId: "31846633000",
            appId: "1:31846633000:web:54bf0ee62f9f6109d7ef1d",
            measurementId: "G-8G7NY8CK23"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const formatNum = (num) => Number(num || 0).toLocaleString('en-US');

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [expenses, setExpenses] = useState([]); 
            
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [sortBy, setSortBy] = useState('name-asc');
            
            // Filters
            const [selectedCategory, setSelectedCategory] = useState('All'); 
            const [stockCategory, setStockCategory] = useState('All'); 
            
            // Performance UI States (Pagination Limits)
            const [visibleHistory, setVisibleHistory] = useState(50);
            const [visibleExpenses, setVisibleExpenses] = useState(50);

            // Modals State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isBulkModalOpen, setIsBulkModalOpen] = useState(false);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null });
            const [editingProduct, setEditingProduct] = useState(null);
            
            // Form Data
            const [formData, setFormData] = useState({ 
                productType: 'game', game: 'ML', pack: '', cost: 0, wholesale: 0, retail: 0, creditsUsed: 0, currentRate: 410, imageUrl: '', faceValue: 0, discountPercent: 0
            });
            const [bulkData, setBulkData] = useState({ category: '', newRate: 0 });
            const [expenseForm, setExpenseForm] = useState({ title: '', amount: 0, note: '', category: 'ອື່ນໆ' });

            // Sheet Sync State
            const [isSheetSyncModalOpen, setIsSheetSyncModalOpen] = useState(false);
            const [sheetUrl, setSheetUrl] = useState('');

            // Dropdown Menu States
            const [salesDropdownOpen, setSalesDropdownOpen] = useState(false);
            const [stockDropdownOpen, setStockDropdownOpen] = useState(false);
            const [gameDropdownOpen, setGameDropdownOpen] = useState(false);

            const expenseCategories = ['ຄ່າອາຫານ', 'ຄ່າເນັດ', 'ຄ່າໄຟ', 'ຄ່ານ້ຳ', 'ຄ່າເຊົ່າຮ້ານ', 'ເງິນເດືອນ', 'ຊື້ເຄື່ອງໃຊ້', 'ອື່ນໆ'];

            const showDialog = (type, message, onConfirm = null) => setDialog({ isOpen: true, type, message, inputValue: '', onConfirm });
            const closeDialog = () => setDialog(prev => ({ ...prev, isOpen: false }));

            // Auth & Initial Load
            useEffect(() => {
                auth.signInAnonymously().catch(e => setAuthError(e.message));
                const unsubscribe = auth.onAuthStateChanged(u => {
                    if(u) { setUser(u); setAuthError(null); }
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            // Data Sync
            useEffect(() => {
                if (!user) return;
                
                const unsubProd = db.collection('products').onSnapshot(s => {
                    setProducts(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                
                const unsubSales = db.collection('sales').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setSales(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubExp = db.collection('expenses').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setExpenses(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => { unsubProd(); unsubSales(); unsubExp(); };
            }, [user]);

            // Auto Calculate Cost in Form
            useEffect(() => {
                const parseVal = (val) => {
                    if (!val) return 0;
                    if (typeof val === 'number') return val;
                    return Number(val.replace(',', '.'));
                };
                
                if (formData.productType === 'topup') {
                    const face = parseVal(formData.faceValue);
                    const disc = parseVal(formData.discountPercent);
                    const cost = face - (face * (disc / 100));
                    if (cost >= 0 && cost !== formData.cost) setFormData(prev => ({ ...prev, cost }));
                } else {
                    const credits = parseVal(formData.creditsUsed);
                    const rate = parseVal(formData.currentRate);
                    const cost = credits * rate;
                    if (cost >= 0 && cost !== formData.cost) setFormData(prev => ({ ...prev, cost }));
                }
            }, [formData.creditsUsed, formData.currentRate, formData.faceValue, formData.discountPercent, formData.productType]);

            // App Handlers
            const handleMakeSale = async (product, type) => {
                if (!user) return;
                const price = type === 'retail' ? product.retail : product.wholesale;
                try {
                    await db.collection('sales').add({
                        productName: `${product.game} - ${product.pack}`,
                        price, profit: price - product.cost, type, creditsUsed: product.creditsUsed || 0,
                        createdAt: Date.now(), timestamp: new Date().toLocaleString('lo-LA')
                    });
                } catch (err) { showDialog('alert', err.message); }
            };

            const handleDeleteSale = (id) => {
                showDialog('confirm', "ຕ້ອງການລຶບລາຍການຂາຍນີ້ບໍ?", async () => {
                    try { await db.collection('sales').doc(id).delete(); } 
                    catch(e) { showDialog('alert', "ເກີດຂໍ້ຜິດພາດ: " + e.message); }
                });
            };

            const handleProductSave = async () => {
                if(!user) return;
                const finalCredits = typeof formData.creditsUsed === 'string' ? parseFloat(formData.creditsUsed.replace(',', '.')) : formData.creditsUsed;
                const finalFaceValue = typeof formData.faceValue === 'string' ? parseFloat(formData.faceValue.replace(',', '.')) : formData.faceValue;
                const finalDiscount = typeof formData.discountPercent === 'string' ? parseFloat(formData.discountPercent.replace(',', '.')) : formData.discountPercent;
                
                const data = { 
                    ...formData, 
                    productType: formData.productType || 'game',
                    creditsUsed: finalCredits || 0, 
                    faceValue: finalFaceValue || 0,
                    discountPercent: finalDiscount || 0,
                    profit: formData.retail - formData.cost, 
                    createdAt: Date.now() 
                };

                try {
                    if (editingProduct) await db.collection('products').doc(editingProduct.id).update(data);
                    else await db.collection('products').add(data);
                    setIsModalOpen(false);
                } catch(e) { showDialog('alert', e.message); }
            };

            const handleProductDelete = (id) => {
                showDialog('confirm', "ຢືນຢັນການລຶບສິນຄ້ານີ້?", async () => {
                    try { await db.collection('products').doc(id).delete(); } catch(e){ showDialog('alert', e.message); }
                });
            };

            const handleAddExpense = async () => {
                if (!expenseForm.title || !expenseForm.amount) return showDialog('alert', "ກະລຸນາໃສ່ຫົວຂໍ້ ແລະ ຈຳນວນເງິນ");
                try {
                    await db.collection('expenses').add({
                        ...expenseForm, amount: Number(expenseForm.amount), createdAt: Date.now(), timestamp: new Date().toLocaleString('lo-LA')
                    });
                    setIsExpenseModalOpen(false);
                    setExpenseForm({ title: '', amount: 0, note: '', category: 'ອື່ນໆ' });
                } catch(e) { showDialog('alert', e.message); }
            };

            const handleDeleteExpense = (id) => {
                showDialog('confirm', "ລຶບລາຍຈ່າຍນີ້?", async () => {
                    try { await db.collection('expenses').doc(id).delete(); } catch(e){ showDialog('alert', e.message); }
                });
            };

            const handleDeleteAllExpenses = () => {
                if (!user) return;
                showDialog('confirm', "⚠️ ຄຳເຕືອນ: ທ່ານຕ້ອງການລຶບປະຫວັດລາຍຈ່າຍທັງໝົດແທ້ບໍ?\nຂໍ້ມູນຈະຫາຍໄປຖາວອນ!", () => {
                    showDialog('prompt', "ກະລຸນາໃສ່ລະຫັດຢືນຢັນ (admin) ເພື່ອລຶບ:", async (pwd) => {
                        if (pwd !== 'admin') return showDialog('alert', "ລະຫັດຜິດພາດ!");
                        setLoading(true);
                        try {
                            const snapshot = await db.collection('expenses').get();
                            if (snapshot.empty) { showDialog('alert', "ບໍ່ມີຂໍ້ມູນໃຫ້ລຶບ"); setLoading(false); return; }
                            const chunks = [];
                            for (let i = 0; i < snapshot.docs.length; i += 400) chunks.push(snapshot.docs.slice(i, i + 400));
                            let deletedCount = 0;
                            for (const chunk of chunks) {
                                const batch = db.batch();
                                chunk.forEach(doc => batch.delete(doc.ref));
                                await batch.commit();
                                deletedCount += chunk.length;
                            }
                            showDialog('alert', `ລຶບຂໍ້ມູນລາຍຈ່າຍທັງໝົດ ${deletedCount} ລາຍການສຳເລັດ!`);
                        } catch (e) { showDialog('alert', "ເກີດຂໍ້ຜິດພາດ: " + e.message); }
                        setLoading(false);
                    });
                });
            };

            const handleDeleteAllHistory = () => {
                if (!user) return;
                showDialog('confirm', "⚠️ ຄຳເຕືອນ: ທ່ານຕ້ອງການລຶບປະຫວັດການຂາຍທັງໝົດແທ້ບໍ?\nຂໍ້ມູນຈະຫາຍໄປຖາວອນ!", () => {
                    showDialog('prompt', "ກະລຸນາໃສ່ລະຫັດຢືນຢັນ (admin) ເພື່ອລຶບ:", async (pwd) => {
                        if (pwd !== 'admin') return showDialog('alert', "ລະຫັດຜິດພາດ!");
                        setLoading(true);
                        try {
                            const snapshot = await db.collection('sales').get();
                            if (snapshot.empty) { showDialog('alert', "ບໍ່ມີຂໍ້ມູນໃຫ້ລຶບ"); setLoading(false); return; }
                            const chunks = [];
                            for (let i = 0; i < snapshot.docs.length; i += 400) chunks.push(snapshot.docs.slice(i, i + 400));
                            let deletedCount = 0;
                            for (const chunk of chunks) {
                                const batch = db.batch();
                                chunk.forEach(doc => batch.delete(doc.ref));
                                await batch.commit();
                                deletedCount += chunk.length;
                            }
                            showDialog('alert', `ລຶບຂໍ້ມູນທັງໝົດ ${deletedCount} ລາຍການສຳເລັດ!`);
                        } catch (e) { showDialog('alert', "ເກີດຂໍ້ຜິດພາດ: " + e.message); }
                        setLoading(false);
                    });
                });
            };

            const handleBulkUpdate = async () => {
                if (!bulkData.category || !bulkData.newRate) return showDialog('alert', "ຂໍ້ມູນບໍ່ຄົບ");
                showDialog('confirm', `ຢືນຢັນການປ່ຽນເລດ ${bulkData.category}?`, async () => {
                    setLoading(true);
                    try {
                        const batch = db.batch();
                        products.filter(p => p.game === bulkData.category).forEach(doc => {
                            if (doc.productType === 'topup') return; 
                            const newCost = doc.creditsUsed * bulkData.newRate;
                            batch.update(db.collection('products').doc(doc.id), { currentRate: Number(bulkData.newRate), cost: newCost, profit: doc.retail - newCost });
                        });
                        await batch.commit();
                        setIsBulkModalOpen(false);
                        showDialog('alert', "ອັບເດດເລດສຳເລັດ!");
                    } catch (e) { showDialog('alert', e.message); }
                    setLoading(false);
                });
            };

            const handleSheetSync = async () => {
                if (!sheetUrl) return showDialog('alert', "ກະລຸນາໃສ່ລິ້ງ Google Sheet (CSV format)");
                setLoading(true);
                try {
                    const res = await fetch(sheetUrl);
                    if (!res.ok) throw new Error("ບໍ່ສາມາດໂຫຼດຂໍ້ມູນຈາກ Sheet ໄດ້ (ກວດເບິ່ງລິ້ງ ຫຼື ລອງ Publish to web ໃໝ່)");
                    const text = await res.text();
                    
                    // Simple CSV Parser ທີ່ຮອງຮັບເຄື່ອງໝາຍຈຸດ ແລະ ລົງແຖວໃນເຊວ
                    const rows = [];
                    let row = [], col = "", quote = false;
                    for (let i = 0; i < text.length; i++) {
                        let c = text[i], nc = text[i+1];
                        if (c === '"' && quote && nc === '"') { col += c; i++; }
                        else if (c === '"') { quote = !quote; }
                        else if (c === ',' && !quote) { row.push(col.trim()); col = ""; }
                        else if ((c === '\n' || (c === '\r' && nc === '\n')) && !quote) {
                            row.push(col.trim()); rows.push(row); row = []; col = "";
                            if (c === '\r') i++;
                        }
                        else { col += c; }
                    }
                    if (col || row.length) { row.push(col.trim()); rows.push(row); }

                    if (rows.length < 2) throw new Error("ຂໍ້ມູນໃນ Sheet ວ່າງເປົ່າ ຫຼື ບໍ່ຖືກຮູບແບບ");

                    const headers = rows[0].map(h => h.toLowerCase().trim());
                    const gameIdx = headers.findIndex(h => h === 'game' || h === 'ເກມ' || h.includes('ໝວດ'));
                    const packIdx = headers.findIndex(h => h.includes('pack') || h.includes('ຊື່ແພັກ') || h.includes('ຊື່ສິນຄ້າ'));
                    const costIdx = headers.findIndex(h => h.includes('cost') || h.includes('ທຶນ') || h.includes('ຕົ້ນທຶນ'));
                    const wholesaleIdx = headers.findIndex(h => h.includes('wholesale') || h.includes('ລາຄາສົ່ງ') || h.includes('ສົ່ງ'));
                    const retailIdx = headers.findIndex(h => h.includes('retail') || h.includes('ລາຄາຂາຍ') || h.includes('ຂາຍຍ່ອຍ'));

                    if (packIdx === -1) throw new Error("ບໍ່ພົບຖັນ 'Pack' (ຊື່ແພັກ/ຊື່ສິນຄ້າ) ໃນ Sheet");
                    if (costIdx === -1 && wholesaleIdx === -1 && retailIdx === -1) throw new Error("ບໍ່ພົບຖັນຕົ້ນທຶນ ຫຼື ລາຄາ ໃນ Sheet");

                    let updatedCount = 0;
                    const batch = db.batch();

                    for (let i = 1; i < rows.length; i++) {
                        if (!rows[i] || rows[i].length <= packIdx) continue;
                        const packName = rows[i][packIdx]?.trim();
                        const gameName = gameIdx !== -1 ? rows[i][gameIdx]?.trim() : null;
                        if (!packName) continue;

                        // ຫາສິນຄ້າໃນລະບົບທີ່ຊື່ກົງກັບໃນ Sheet (ແລະ ກົງກັບ Game ຖ້າມີຖັນ Game)
                        const matchedProducts = products.filter(p => {
                            const isPackMatch = p.pack.toLowerCase() === packName.toLowerCase();
                            if (gameName) return isPackMatch && p.game.toLowerCase() === gameName.toLowerCase();
                            return isPackMatch;
                        });
                        
                        for (const p of matchedProducts) {
                            const updates = {};
                            const cleanNum = (str) => Number(str.replace(/[^0-9.-]+/g,""));
                            
                            if (costIdx !== -1 && rows[i][costIdx]) updates.cost = cleanNum(rows[i][costIdx]);
                            if (wholesaleIdx !== -1 && rows[i][wholesaleIdx]) updates.wholesale = cleanNum(rows[i][wholesaleIdx]);
                            if (retailIdx !== -1 && rows[i][retailIdx]) updates.retail = cleanNum(rows[i][retailIdx]);
                            
                            if (Object.keys(updates).length > 0) {
                                // ອັບເດດກຳໄລຖ້າມີການປ່ຽນແປງຕົ້ນທຶນ ຫຼື ລາຄາຂາຍຍ່ອຍ
                                const finalRetail = updates.retail !== undefined ? updates.retail : p.retail;
                                const finalCost = updates.cost !== undefined ? updates.cost : p.cost;
                                updates.profit = finalRetail - finalCost;
                                
                                batch.update(db.collection('products').doc(p.id), updates);
                                updatedCount++;
                            }
                        }
                    }

                    if (updatedCount > 0) {
                        await batch.commit();
                        showDialog('alert', `ອັບເດດຂໍ້ມູນສຳເລັດ ${updatedCount} ລາຍການ! 🎉`);
                        setIsSheetSyncModalOpen(false);
                        setSheetUrl('');
                    } else {
                        showDialog('alert', "ບໍ່ມີລາຍການໃດກົງກັບຊື່ Pack ໃນລະບົບເລີຍ (ກວດເບິ່ງການສະກົດຄຳ)");
                    }
                } catch (err) {
                    showDialog('alert', err.message);
                }
                setLoading(false);
            };

            // Derived Stats
            const totalSales = sales.reduce((a, b) => a + b.price, 0);
            const totalProfit = sales.reduce((a, b) => a + b.profit, 0);
            const totalExpenses = expenses.reduce((a, b) => a + b.amount, 0);
            const netProfit = totalProfit - totalExpenses;
            
            const categories = ['All', ...new Set(products.map(p => p.game))];

            const categoryImages = useMemo(() => {
                const map = {};
                products.forEach(p => { if (p.imageUrl && !map[p.game]) map[p.game] = p.imageUrl; });
                return map;
            }, [products]);

            const sortedSalesProducts = useMemo(() => {
                let filtered = products.filter(p => (selectedCategory === 'All' || p.game === selectedCategory) && p.pack.toLowerCase().includes(searchTerm.toLowerCase()));
                return filtered.sort((a, b) => {
                    if (sortBy === 'name-asc') return a.pack.localeCompare(b.pack);
                    if (sortBy === 'price-asc') return a.retail - b.retail;
                    if (sortBy === 'price-desc') return b.retail - a.retail;
                    return 0;
                });
            }, [products, selectedCategory, searchTerm, sortBy]);

            const dailyStats = useMemo(() => {
                const groups = {};
                sales.forEach(s => {
                    const date = new Date(s.createdAt).toLocaleDateString('en-GB'); 
                    if(!groups[date]) groups[date] = { date, sales: 0, profit: 0, count: 0, rawDate: s.createdAt, items: {} };
                    groups[date].sales += s.price;
                    groups[date].profit += s.profit;
                    groups[date].count += 1;
                    
                    if (!groups[date].items[s.productName]) groups[date].items[s.productName] = 0;
                    groups[date].items[s.productName] += 1;
                });
                return Object.values(groups).map(day => {
                    const topItems = Object.entries(day.items)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 3)
                        .map(item => ({ name: item[0], count: item[1] }));
                    return { ...day, topItems };
                }).sort((a, b) => b.rawDate - a.rawDate);
            }, [sales]);

            const topSellingProducts = useMemo(() => {
                const counts = {};
                sales.forEach(sale => {
                    if (!counts[sale.productName]) counts[sale.productName] = { name: sale.productName, count: 0 };
                    counts[sale.productName].count += 1;
                });
                return Object.values(counts).sort((a, b) => b.count - a.count).slice(0, 5);
            }, [sales]);

            // Rendering States
            if (authError) return <div className="h-screen flex items-center justify-center bg-rose-50 text-rose-600 p-10 font-bold">{authError}</div>;
            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="w-16 h-16 border-4 border-indigo-200 border-t-pink-500 rounded-full animate-spin shadow-glow-secondary"></div></div>;

            return (
                <div className="flex min-h-screen">
                    
                    {/* Sidebar - Colorful Glass */}
                    <aside className="hidden md:flex w-[280px] flex-col fixed inset-y-4 left-4 glass-panel rounded-3xl z-20">
                        <div className="p-6 pb-4">
                            <div className="flex items-center gap-3 mb-1">
                                <div className="p-3 bg-gradient-to-br from-indigo-500 to-pink-500 rounded-2xl text-white shadow-glow-secondary animate-float"><Icon name="boxes" size={24} /></div>
                                <div>
                                    <span className="text-[1.25rem] font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-pink-600">ລຸງແມັກສະຕ໋ອກ</span>
                                    <div className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mt-0.5">Playful POS</div>
                                </div>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 py-4 space-y-2 overflow-y-auto custom-scroll">
                            {[
                                { id: 'dashboard', icon: 'layout-dashboard', label: 'ພາບລວມ', color: 'from-blue-500 to-indigo-500' },
                                { id: 'sales', icon: 'shopping-cart', label: 'ຂາຍສິນຄ້າ', color: 'from-pink-500 to-rose-500' },
                                { id: 'stock', icon: 'package', label: 'ຄັງສິນຄ້າ', color: 'from-amber-400 to-orange-500' },
                                { id: 'expenses', icon: 'wallet', label: 'ລາຍຈ່າຍ', color: 'from-emerald-400 to-teal-500' },
                                { id: 'daily', icon: 'bar-chart-3', label: 'ສະຫຼຸບຍອດ', color: 'from-cyan-400 to-blue-500' },
                                { id: 'history', icon: 'history', label: 'ປະຫວັດ', color: 'from-violet-500 to-purple-500' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl text-sm font-bold transition-all duration-300 group ${
                                        activeTab === item.id 
                                        ? `bg-gradient-to-r ${item.color} text-white shadow-lg hover:scale-[1.02] translate-x-1` 
                                        : 'text-slate-500 hover:bg-white/60 hover:text-indigo-600 hover:translate-x-1'
                                    }`}>
                                    <div className={`p-1.5 rounded-xl transition-colors ${activeTab === item.id ? 'bg-white/20' : 'bg-slate-100 group-hover:bg-indigo-100'}`}>
                                        <Icon name={item.icon} size={18} className={activeTab === item.id ? 'text-white' : 'text-slate-400 group-hover:text-indigo-600'} />
                                    </div>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-white/40 mt-auto">
                            <div className="flex items-center gap-3 px-3 py-3 bg-white/50 rounded-2xl border border-white hover:bg-white/80 transition-colors cursor-pointer">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-black text-sm shadow-md">A</div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-sm font-extrabold text-slate-700 truncate">ຜູ້ເບິ່ງແຍງລະບົບ</p>
                                    <p className="text-[10px] text-emerald-500 font-bold flex items-center gap-1.5 mt-0.5"><span className="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse"></span> ອອນລາຍ</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 md:ml-[300px] p-4 md:p-8 pb-32 md:pb-12 max-w-[1400px] mx-auto w-full relative overflow-x-hidden">
                        {/* Mobile Header */}
                        <div className="md:hidden flex justify-between items-center mb-6 glass-panel p-4 rounded-3xl">
                            <span className="font-extrabold text-lg bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-pink-600 flex items-center gap-2">
                                <div className="p-1.5 bg-gradient-to-br from-indigo-500 to-pink-500 rounded-xl text-white shadow-sm"><Icon name="boxes" size={20} /></div> ລຸງແມັກສະຕ໋ອກ
                            </span>
                            <div className="w-9 h-9 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-md">A</div>
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-pop">
                                <div><h1 className="text-3xl font-black text-slate-800 mb-1 tracking-tight">ສະບາຍດີ, ແອັດມິນ ✨</h1><p className="text-slate-500 text-sm font-medium">ຍິນດີຕ້ອນຮັບສູ່ລະບົບຈັດການທີ່ສົດໃສທີ່ສຸດ!</p></div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <StatCard label="ຍອດຂາຍລວມມື້ນີ້" value={totalSales} icon="banknote" gradient="from-blue-500 to-indigo-500" />
                                    <StatCard label="ກຳໄລສຸດທິ (Net Profit)" value={netProfit} icon="trending-up" gradient="from-pink-500 to-rose-500" subtext={`ຫັກລາຍຈ່າຍ ${formatNum(totalExpenses)} ₭ ແລ້ວ`} />
                                    <StatCard label="ຈຳນວນອໍເດີທັງໝົດ" value={sales.length} icon="shopping-bag" gradient="from-amber-400 to-orange-500" isMoney={false} />
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="glass-card rounded-[2rem] p-6 shadow-glass flex flex-col hover:-translate-y-1 transition-transform duration-300">
                                        <div className="flex items-center justify-between mb-5">
                                            <h3 className="font-extrabold text-slate-800 flex items-center gap-2.5"><div className="p-2 bg-indigo-100 rounded-xl text-indigo-600"><Icon name="clock" size={18}/></div> ຂາຍລ່າສຸດ</h3>
                                        </div>
                                        <div className="flex-1 overflow-x-auto custom-scroll">
                                            <table className="w-full text-left text-sm">
                                                <tbody className="divide-y divide-slate-100/50">
                                                    {sales.slice(0, 5).map(s => (
                                                        <tr key={s.id} className="hover:bg-white/50 transition-colors group">
                                                            <td className="py-4 pr-4 font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">{s.productName}</td>
                                                            <td className="py-4 text-right font-black text-slate-900 group-hover:text-indigo-600 transition-colors">{formatNum(s.price)}</td>
                                                        </tr>
                                                    ))}
                                                    {sales.length === 0 && <tr><td colSpan="2" className="py-8 text-center text-slate-400 font-bold">ຍັງບໍ່ມີອໍເດີເທື່ອ ~</td></tr>}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    
                                    <div className="glass-card rounded-[2rem] p-6 shadow-glass flex flex-col hover:-translate-y-1 transition-transform duration-300">
                                        <div className="flex items-center justify-between mb-5">
                                            <h3 className="font-extrabold text-slate-800 flex items-center gap-2.5"><div className="p-2 bg-orange-100 rounded-xl text-orange-600"><Icon name="flame" size={18}/></div> ສິນຄ້າຂາຍດີ</h3>
                                        </div>
                                        <div className="flex-1 overflow-x-auto custom-scroll">
                                            <table className="w-full text-left text-sm">
                                                <tbody className="divide-y divide-slate-100/50">
                                                    {topSellingProducts.map((p, index) => (
                                                        <tr key={p.name} className="hover:bg-white/50 transition-colors group">
                                                            <td className="py-3.5 pr-3 w-10">
                                                                <span className={`w-8 h-8 flex items-center justify-center rounded-xl text-xs font-black shadow-sm ${index === 0 ? 'bg-gradient-to-br from-yellow-300 to-amber-500 text-white' : index === 1 ? 'bg-gradient-to-br from-slate-200 to-slate-400 text-white' : index === 2 ? 'bg-gradient-to-br from-orange-300 to-rose-400 text-white' : 'bg-white text-slate-400'}`}>
                                                                    #{index + 1}
                                                                </span>
                                                            </td>
                                                            <td className="py-3.5 font-bold text-slate-700 group-hover:text-orange-500 transition-colors">{p.name}</td>
                                                            <td className="py-3.5 text-right">
                                                                <span className="font-black text-slate-800 bg-white/80 px-2.5 py-1 rounded-lg border border-slate-100">{p.count}</span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    {topSellingProducts.length === 0 && <tr><td colSpan="3" className="py-8 text-center text-slate-400 font-bold">ບໍ່ມີຂໍ້ມູນ ~</td></tr>}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div className="glass-card rounded-[2rem] p-6 shadow-glass flex flex-col hover:-translate-y-1 transition-transform duration-300">
                                        <div className="flex items-center justify-between mb-5">
                                            <h3 className="font-extrabold text-slate-800 flex items-center gap-2.5"><div className="p-2 bg-rose-100 rounded-xl text-rose-600"><Icon name="wallet" size={18}/></div> ລາຍຈ່າຍລ່າສຸດ</h3>
                                        </div>
                                        <div className="flex-1 overflow-x-auto custom-scroll">
                                            <table className="w-full text-left text-sm">
                                                <tbody className="divide-y divide-slate-100/50">
                                                    {expenses.length === 0 ? <tr><td colSpan="2" className="py-8 text-center text-slate-400 font-bold">ບໍ່ມີລາຍຈ່າຍ ~</td></tr> : 
                                                    expenses.slice(0, 5).map(e => (
                                                        <tr key={e.id} className="hover:bg-white/50 transition-colors group">
                                                            <td className="py-4 pr-4 font-bold text-slate-700">{e.title}</td>
                                                            <td className="py-4 text-right font-black text-rose-500 bg-rose-50/30 rounded-r-xl">-{formatNum(e.amount)}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'sales' && (
                            <div className="animate-pop space-y-4">
                                <div className="flex flex-col gap-3 sticky top-0 bg-white/40 backdrop-blur-2xl py-3 z-30 -mx-4 px-4 sm:mx-0 sm:px-0 rounded-b-3xl sm:rounded-3xl shadow-sm border border-white">
                                    <div className="flex flex-col md:flex-row gap-3">
                                        <div className="relative flex-1 group z-10">
                                            <div className="absolute -inset-0.5 bg-gradient-to-r from-pink-500 to-indigo-500 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-500"></div>
                                            <div className="relative flex items-center bg-white rounded-2xl">
                                                <Icon name="search" className="absolute left-4 text-indigo-400" size={20} />
                                                <input type="text" placeholder="ຄົ້ນຫາແພັກເກມທີ່ຕ້ອງການ..." className="w-full pl-12 pr-4 py-3.5 rounded-2xl border-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-700 outline-none transition-all bg-transparent" 
                                                    value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                            </div>
                                        </div>
                                        <div className="flex flex-col sm:flex-row gap-3 z-20">
                                            {/* CATEGORY DROPDOWN */}
                                            <div className="relative w-full sm:w-56" tabIndex="0" onBlur={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setSalesDropdownOpen(false); }}>
                                                <button
                                                    onClick={() => setSalesDropdownOpen(!salesDropdownOpen)}
                                                    className="flex w-full items-center justify-between gap-2 bg-[#8b5cf6] text-white px-5 py-3.5 rounded-2xl font-bold shadow-md hover:bg-purple-600 transition-colors"
                                                >
                                                    <div className="flex items-center gap-2 truncate">
                                                        <Icon name="store" size={18} />
                                                        <span className="truncate">{selectedCategory === 'All' ? 'ທຸກໝວດໝູ່ (All)' : selectedCategory}</span>
                                                    </div>
                                                    <Icon name="chevron-down" size={18} className={`flex-shrink-0 transition-transform duration-300 ${salesDropdownOpen ? 'rotate-180' : ''}`} />
                                                </button>
                                                
                                                {salesDropdownOpen && (
                                                    <div className="absolute top-full left-0 mt-2 w-full sm:w-64 bg-white rounded-2xl shadow-[0_10px_40px_-10px_rgba(139,92,246,0.5)] border border-purple-100 py-2 z-50 animate-pop origin-top max-h-[60vh] overflow-y-auto custom-scroll">
                                                        {categories.map(c => (
                                                            <button
                                                                key={c}
                                                                onClick={() => { setSelectedCategory(c); setSalesDropdownOpen(false); }}
                                                                className={`w-full text-left px-5 py-3 text-sm font-bold transition-colors flex items-center gap-3 ${selectedCategory === c ? 'text-[#8b5cf6] bg-purple-50' : 'text-[#8b5cf6]/80 hover:bg-purple-50 hover:text-[#8b5cf6]'}`}
                                                            >
                                                                {c !== 'All' && categoryImages[c] ? (
                                                                    <img src={categoryImages[c]} alt={c} loading="lazy" className="w-6 h-6 rounded-md object-cover shadow-sm bg-white" />
                                                                ) : (
                                                                    <Icon name={c === 'All' ? 'sparkles' : 'gamepad-2'} size={18} />
                                                                )}
                                                                <span className="truncate">{c === 'All' ? 'ທຸກໝວດໝູ່' : c}</span>
                                                            </button>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* SORT DROPDOWN */}
                                            <div className="relative w-full sm:w-48 z-10">
                                                <select 
                                                    className="w-full appearance-none bg-white/80 backdrop-blur-md px-4 py-3.5 rounded-2xl border border-white shadow-sm text-slate-700 font-extrabold focus:ring-2 focus:ring-pink-500 outline-none cursor-pointer transition-all hover:bg-white"
                                                    value={sortBy} onChange={e => setSortBy(e.target.value)}
                                                >
                                                    <option value="name-asc">🔤 ລຽງຕາມຊື່ (A-Z)</option>
                                                    <option value="price-asc">📉 ລາຄາ (ຖືກ-ແພງ)</option>
                                                    <option value="price-desc">📈 ລາຄາ (ແພງ-ຖືກ)</option>
                                                </select>
                                                <Icon name="chevron-down" size={18} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* PRODUCT GRID */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-5 pb-24 md:pb-6 pt-2">
                                    {sortedSalesProducts.map(p => (
                                        <div key={p.id} className="glass-card p-5 rounded-[1.5rem] shadow-glass hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 group flex flex-col relative overflow-hidden">
                                            {/* decorative blob */}
                                            <div className="absolute -right-6 -top-6 w-24 h-24 bg-gradient-to-br from-pink-200/40 to-indigo-200/40 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                                            
                                            <div className="flex items-center gap-4 mb-5 relative z-10">
                                                {p.imageUrl ? (
                                                    <img src={p.imageUrl} alt={p.pack} loading="lazy" className="w-14 h-14 rounded-2xl object-cover shadow-md border-2 border-white bg-white group-hover:scale-110 transition-transform duration-300" />
                                                ) : (
                                                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-100 to-pink-100 flex items-center justify-center text-indigo-400 border-2 border-white shadow-sm group-hover:scale-110 transition-transform duration-300">
                                                        <Icon name="image" size={24} />
                                                    </div>
                                                )}
                                                <div className="flex-1 min-w-0">
                                                    <span className="px-2.5 py-1 rounded-lg bg-white/80 border border-slate-100 text-indigo-600 text-[10px] font-black uppercase tracking-wider inline-block mb-1.5 shadow-sm">{p.game}</span>
                                                    <h3 className="font-extrabold text-slate-800 text-sm leading-tight truncate group-hover:text-pink-600 transition-colors">{p.pack}</h3>
                                                </div>
                                            </div>
                                            <div className="mt-auto grid grid-cols-2 gap-3 relative z-10">
                                                <button onClick={() => handleMakeSale(p, 'wholesale')} className="py-3 rounded-xl bg-white/60 text-slate-700 font-extrabold text-xs hover:bg-gradient-to-r hover:from-cyan-400 hover:to-blue-500 hover:text-white transition-all duration-300 flex flex-col items-center justify-center border border-white shadow-sm hover:shadow-glow-primary active:scale-95 group/btn">
                                                    <span className="text-sm">{formatNum(p.wholesale)}</span><span className="text-[10px] uppercase font-bold text-slate-400 group-hover/btn:text-cyan-100 mt-0.5">ລາຄາສົ່ງ</span>
                                                </button>
                                                <button onClick={() => handleMakeSale(p, 'retail')} className="py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-pink-500 text-white font-extrabold text-xs shadow-md shadow-pink-500/30 hover:shadow-glow-secondary hover:-translate-y-0.5 transition-all duration-300 flex flex-col items-center justify-center border border-pink-400/50 active:scale-95 group/btn">
                                                    <span className="text-sm">{formatNum(p.retail)}</span><span className="text-[10px] uppercase font-bold text-pink-200 mt-0.5">ຂາຍຍ່ອຍ</span>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                    {sortedSalesProducts.length === 0 && (
                                        <div className="col-span-full py-20 flex flex-col items-center justify-center text-slate-400 glass-card rounded-[2rem] border-dashed border-2 border-slate-300/50">
                                            <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4"><Icon name="ghost" size={40} className="text-slate-300 animate-bounce"/></div>
                                            <p className="font-extrabold text-lg text-slate-500">ບໍ່ພົບລາຍການສິນຄ້າ!</p>
                                            <p className="text-sm mt-1">ລອງຄົ້ນຫາດ້ວຍຄຳອື່ນເບິ່ງເດີ້</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'stock' && (
                            <div className="space-y-6 animate-pop">
                                <div className="flex flex-col gap-4 glass-panel p-5 rounded-[2rem] z-20 relative mb-2">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Icon name="package-search" className="text-accent" /> ຈັດການສິນຄ້າ</h2>
                                            <p className="text-slate-500 text-sm mt-1 font-medium">ເພີ່ມ, ແກ້ໄຂ ແລະ ອັບເດດລາຄາສິນຄ້າໃນຄັງ</p>
                                        </div>
                                        <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                                            <button onClick={() => setIsSheetSyncModalOpen(true)} className="flex-1 sm:flex-none justify-center items-center gap-1.5 bg-emerald-50 text-emerald-600 border border-emerald-200 px-4 py-2.5 rounded-2xl font-black text-xs hover:bg-emerald-100 transition-all flex">
                                                <Icon name="file-spreadsheet" size={16}/> ຊິງຄ໌
                                            </button>
                                            <button onClick={() => setIsBulkModalOpen(true)} className="flex-1 sm:flex-none justify-center items-center gap-1.5 bg-white text-indigo-600 border border-indigo-100 px-4 py-2.5 rounded-2xl font-black text-xs hover:bg-indigo-50 transition-all flex">

                                    {dialog.type === 'alert' ? 'ແຈ້ງເຕືອນ' : dialog.type === 'confirm' ? 'ຢືນຢັນການເຮັດວຽກ' : 'ຕ້ອງການລະຫັດຜ່ານ'}
                                </h3>
                                <p className="text-slate-500 text-sm font-medium mb-8 whitespace-pre-wrap">{dialog.message}</p>
                                
                                {dialog.type === 'prompt' && (
                                    <input type="password" autoFocus className="w-full bg-white/50 border border-white rounded-2xl p-4 font-black text-center text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 mb-6 shadow-sm" value={dialog.inputValue} onChange={e => setDialog({...dialog, inputValue: e.target.value})} placeholder="ໃສ່ລະຫັດ..." />
                                )}
                                
                                <div className="flex justify-center gap-3">
                                    {dialog.type !== 'alert' && <button onClick={closeDialog} className="flex-1 py-3.5 rounded-2xl font-black text-slate-600 bg-white hover:bg-slate-50 border border-slate-100 transition-all shadow-sm active:scale-95">ຍົກເລີກ</button>}
                                    <button onClick={() => { 
                                        const { type, onConfirm, inputValue } = dialog;
                                        closeDialog(); 
                                        if (type === 'prompt') {
                                            onConfirm && onConfirm(inputValue); 
                                        } else {
                                            onConfirm && onConfirm();
                                        }
                                    }} className="flex-1 py-3.5 rounded-2xl font-black text-white bg-gradient-to-r from-indigo-500 to-pink-500 hover:shadow-glow-secondary transition-all shadow-md active:scale-95">ຕົກລົງ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Product */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md animate-pop">
                            <div className="glass-card w-full max-w-lg rounded-[2rem] p-7 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scroll border border-white">
                                <button onClick={() => setIsModalOpen(false)} className="absolute top-6 right-6 p-2.5 text-slate-400 bg-white rounded-full hover:bg-pink-50 hover:text-pink-600 transition-all shadow-sm"><Icon name="x" size={20}/></button>
                                <h2 className="text-2xl font-black text-slate-800 mb-6 flex items-center gap-3"><Icon name={editingProduct ? 'edit-3' : 'plus-circle'} className="text-indigo-500"/> {editingProduct ? 'ແກ້ໄຂສິນຄ້າ' : 'ເພີ່ມສິນຄ້າໃໝ່'}</h2>
                                
                                <div className="flex bg-white/60 p-1.5 rounded-2xl mb-6 shadow-sm border border-white">
                                    <button onClick={() => setFormData({...formData, productType: 'game'})} className={`flex-1 py-2.5 text-xs font-black rounded-xl transition-all ${formData.productType === 'game' || !formData.productType ? 'bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-md scale-100' : 'text-slate-500 hover:text-slate-800'}`}>🎮 ແພັກເກມ (Game)</button>
                                    <button onClick={() => setFormData({...formData, productType: 'topup'})} className={`flex-1 py-2.5 text-xs font-black rounded-xl transition-all ${formData.productType === 'topup' ? 'bg-gradient-to-r from-emerald-400 to-teal-500 text-white shadow-md scale-100' : 'text-slate-500 hover:text-slate-800'}`}>📱 ບັດເຕີມເງິນ (Top-up)</button>
                                </div>

                                <div className="space-y-5">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1.5 relative" tabIndex="0" onBlur={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setGameDropdownOpen(false); }}>
                                            <label className="text-[10px] font-black text-slate-500 uppercase ml-1">{formData.productType === 'topup' ? 'ເຄືອຂ່າຍ (Network)' : 'Game'}</label>
                                            <div className="relative">
                                                <input 
                                                    className="w-full bg-white/70 border border-white rounded-2xl p-3.5 pr-10 font-bold text-sm text-slate-800 outline-none focus:ring-2 focus:ring-indigo-400 transition-all shadow-sm" 
                                                    value={formData.game} 
                                                    onChange={e => { setFormData({...formData, game: e.target.value}); setGameDropdownOpen(true); }} 
                                                    onFocus={() => setGameDropdownOpen(true)}
                                                    placeholder="ເລືອກ ຫຼື ພິມໃໝ່..." 
                                                />
                                                <button 
                                                    type="button"
                                                    onClick={() => setGameDropdownOpen(!gameDropdownOpen)}
                                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-500 p-1"
                                                >
                                                    <Icon name="chevron-down" size={18} className={`transition-transform duration-300 ${gameDropdownOpen ? 'rotate-180' : ''}`} />
                                                </button>
                                            </div>
                                            
                                            {gameDropdownOpen && categories.filter(c => c !== 'All').length > 0 && (
                                                <div className="absolute top-full left-0 mt-1 w-full bg-white rounded-xl shadow-xl border border-indigo-100 py-1.5 z-50 max-h-40 overflow-y-auto custom-scroll">
                                                    {categories.filter(c => c !== 'All' && c.toLowerCase().includes(formData.game.toLowerCase())).length > 0 ? (
                                                        categories.filter(c => c !== 'All' && c.toLowerCase().includes(formData.game.toLowerCase())).map(c => (
                                                            <button
                                                                key={c}
                                                                type="button"
                                                                onClick={() => { setFormData({...formData, game: c}); setGameDropdownOpen(false); }}
                                                                className="w-full text-left px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                                                            >
                                                                {c}
                                                            </button>
                                                        ))
                                                    ) : (
                                                        <div className="px-4 py-2.5 text-xs text-slate-400 font-bold text-center">ພິມເພື່ອສ້າງໝວດໝູ່ໃໝ່</div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">{formData.productType === 'topup' ? 'ຊື່ແພັກ / ມູນຄ່າ' : 'ຊື່ແພັກ (Pack Name)'}</label><input className="w-full bg-white/70 border border-white rounded-2xl p-3.5 font-bold text-sm text-slate-800 outline-none focus:ring-2 focus:ring-indigo-400 transition-all shadow-sm" value={formData.pack} onChange={e => setFormData({...formData, pack: e.target.value})} /></div>
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-[10px] font-black text-slate-500 uppercase ml-1">ລິ້ງຮູບພາບ (ໃສ່ ຫຼື ບໍ່ໃສ່ກໍໄດ້)</label>
                                        <div className="flex gap-3 items-center">
                                            <input className="flex-1 bg-white/70 border border-white rounded-2xl p-3.5 font-medium text-sm text-slate-600 outline-none focus:ring-2 focus:ring-indigo-400 transition-all shadow-sm" value={formData.imageUrl || ''} onChange={e => setFormData({...formData, imageUrl: e.target.value})} placeholder="https://..." />
                                            {formData.imageUrl && <img src={formData.imageUrl} alt="preview" className="w-12 h-12 rounded-xl object-cover border-2 border-white shadow-md bg-white" />}
                                        </div>
                                    </div>

                                    {formData.productType === 'topup' ? (
                                        <div className="bg-gradient-to-br from-emerald-50 to-teal-50 p-5 rounded-3xl border border-white shadow-sm space-y-4">
                                            <div className="flex items-center justify-between"><div className="flex items-center gap-2 text-emerald-600 text-[10px] font-black uppercase tracking-wider bg-emerald-100/50 px-3 py-1.5 rounded-lg"><Icon name="percent" size={16}/> ຄິດໄລ່ຕົ້ນທຶນບັດເຕີມເງິນ</div></div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1.5"><label className="text-[10px] font-black text-emerald-500 ml-1">ມູນຄ່າໜ້າບັດ</label><input type="number" placeholder="10000" className="w-full bg-white border border-emerald-100 rounded-2xl p-3.5 font-black text-slate-800 outline-none focus:ring-2 focus:ring-emerald-400 shadow-sm" value={formData.faceValue} onChange={e => setFormData({...formData, faceValue: e.target.value})} /></div>
                                                <div className="space-y-1.5"><label className="text-[10px] font-black text-emerald-500 ml-1">ສ່ວນຫຼຸດ (%)</label><input type="number" placeholder="5" className="w-full bg-white border border-emerald-100 rounded-2xl p-3.5 font-black text-slate-800 outline-none focus:ring-2 focus:ring-emerald-400 shadow-sm" value={formData.discountPercent} onChange={e => setFormData({...formData, discountPercent: e.target.value})} /></div>
                                            </div>
                                            <div className="flex justify-between items-center pt-3 border-t-2 border-emerald-100/50 mt-2"><span className="text-[10px] font-black text-emerald-500 uppercase">ຕົ້ນທຶນຫຼັງຫັກສ່ວນຫຼຸດ</span><span className="text-2xl font-black text-emerald-600 drop-shadow-sm">{formatNum(formData.cost)}</span></div>
                                        </div>
                                    ) : (
                                        <div className="bg-gradient-to-br from-indigo-50 to-purple-50 p-5 rounded-3xl border border-white shadow-sm space-y-4">
                                            <div className="flex items-center justify-between"><div className="flex items-center gap-2 text-indigo-600 text-[10px] font-black uppercase tracking-wider bg-indigo-100/50 px-3 py-1.5 rounded-lg"><Icon name="calculator" size={16}/> ຄິດໄລ່ຕົ້ນທຶນອັດຕະໂນມັດ</div></div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1.5"><label className="text-[10px] font-black text-indigo-500 ml-1">ຈຳນວນເຄຣດິດ</label><input type="text" inputMode="decimal" placeholder="0.00" className="w-full bg-white border border-indigo-100 rounded-2xl p-3.5 font-black text-slate-800 outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm" value={formData.creditsUsed} onChange={e => { const val = e.target.value; if (/^[0-9]*[.,]?[0-9]*$/.test(val)) setFormData({...formData, creditsUsed: val}); }} /></div>
                                                <div className="space-y-1.5"><label className="text-[10px] font-black text-indigo-500 ml-1">ເລດປັດຈຸບັນ (Rate)</label><input type="number" className="w-full bg-white border border-indigo-100 rounded-2xl p-3.5 font-black text-slate-800 outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm" value={formData.currentRate} onChange={e => setFormData({...formData, currentRate: Number(e.target.value)})} /></div>
                                            </div>
                                            <div className="flex justify-between items-center pt-3 border-t-2 border-indigo-100/50 mt-2"><span className="text-[10px] font-black text-indigo-500 uppercase">ຕົ້ນທຶນລວມ</span><span className="text-2xl font-black text-indigo-600 drop-shadow-sm">{formatNum(formData.cost)}</span></div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">ລາຄາສົ່ງ</label><input type="number" className="w-full bg-white/70 border border-white rounded-2xl p-3.5 font-black text-slate-800 outline-none focus:ring-2 focus:ring-pink-400 shadow-sm transition-all" value={formData.wholesale} onChange={e => setFormData({...formData, wholesale: Number(e.target.value)})} /></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">ລາຄາຂາຍຍ່ອຍ</label><input type="number" className="w-full bg-white/70 border border-white rounded-2xl p-3.5 font-black text-slate-800 outline-none focus:ring-2 focus:ring-pink-400 shadow-sm transition-all" value={formData.retail} onChange={e => setFormData({...formData, retail: Number(e.target.value)})} /></div>
                                    </div>
                                    <button onClick={handleProductSave} className={`w-full text-white py-4 rounded-2xl font-black shadow-lg transition-all active:scale-95 text-sm mt-4 tracking-wide ${formData.productType === 'topup' ? 'bg-gradient-to-r from-emerald-400 to-teal-500 hover:shadow-emerald-500/40' : 'bg-gradient-to-r from-indigo-500 to-pink-500 hover:shadow-pink-500/40'}`}>✨ ບັນທຶກຂໍ້ມູນ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Bulk Edit */}
                    {isBulkModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md animate-pop">
                            <div className="glass-card w-full max-w-sm rounded-[2rem] p-7 shadow-2xl relative border border-white">
                                <button onClick={() => setIsBulkModalOpen(false)} className="absolute top-5 right-5 p-2.5 text-slate-400 bg-white rounded-full hover:bg-pink-50 hover:text-pink-600 transition-all shadow-sm"><Icon name="x" size={20}/></button>
                                <div className="mb-6">
                                    <div className="w-12 h-12 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-2xl flex items-center justify-center text-indigo-500 mb-4 shadow-sm border border-white"><Icon name="layers" size={24}/></div>
                                    <h2 className="text-2xl font-black text-slate-800">ປ່ຽນເລດຍົກໝວດ</h2>
                                    <p className="text-slate-500 text-xs mt-1.5 font-bold">ລະບົບຈະຄິດໄລ່ຕົ້ນທຶນໃໝ່ອັດຕະໂນມັດ</p>
                                </div>
                                <div className="space-y-5">
                                    <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">ເລືອກໝວດໝູ່</label><div className="flex flex-wrap gap-2">{categories.filter(c => c !== 'All').map(c => (<button key={c} onClick={() => setBulkData({...bulkData, category: c})} className={`px-4 py-2 rounded-xl text-xs font-black transition-all border ${bulkData.category === c ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105' : 'bg-white/70 text-slate-600 border-white hover:border-indigo-200 shadow-sm'}`}>{c}</button>))}</div></div>
                                    <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">ປ້ອນເລດໃໝ່</label><input type="number" placeholder="ຕົວຢ່າງ: 420" className="w-full bg-white/80 border border-white rounded-2xl p-4 font-black text-xl text-center text-indigo-600 outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner" value={bulkData.newRate} onChange={e => setBulkData({...bulkData, newRate: e.target.value})} /></div>
                                    <button onClick={handleBulkUpdate} className="w-full bg-slate-800 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-slate-900 hover:shadow-slate-900/30 transition-all active:scale-95 flex justify-center items-center gap-2 text-sm">ອັບເດດທັງໝົດ 🚀</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Google Sheet Sync */}
                    {isSheetSyncModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md animate-pop">
                            <div className="glass-card w-full max-w-lg rounded-[2rem] p-7 shadow-2xl relative border border-white">
                                <button onClick={() => setIsSheetSyncModalOpen(false)} className="absolute top-5 right-5 p-2.5 text-slate-400 bg-white rounded-full hover:bg-emerald-50 hover:text-emerald-600 transition-all shadow-sm"><Icon name="x" size={20}/></button>
                                <div className="mb-6">
                                    <div className="w-12 h-12 bg-gradient-to-br from-emerald-100 to-teal-100 rounded-2xl flex items-center justify-center text-emerald-500 mb-4 shadow-sm border border-white"><Icon name="file-spreadsheet" size={24}/></div>
                                    <h2 className="text-2xl font-black text-slate-800">ຊິງຄ໌ຂໍ້ມູນຈາກ Google Sheet</h2>
                                    <p className="text-slate-500 text-xs mt-1.5 font-bold leading-relaxed">ອັບເດດຕົ້ນທຶນ ແລະ ລາຄາຂາຍອັດຕະໂນມັດໂດຍການດຶງຂໍ້ມູນຈາກ Google Sheet ທີ່ Publish ເປັນຮູບແບບ CSV.</p>
                                </div>
                                
                                <div className="bg-white/60 p-4 rounded-2xl border border-white shadow-sm mb-5 space-y-2 text-xs font-medium text-slate-600">
                                    <p className="font-bold text-slate-800 text-sm flex items-center gap-1.5"><Icon name="info" size={16} className="text-indigo-500"/> ວິທີການຕັ້ງຄ່າ Sheet:</p>
                                    <ol className="list-decimal pl-5 space-y-1.5">
                                        <li>ສ້າງແຖວຫົວຂໍ້ໃຫ້ມີຄຳວ່າ: <span className="font-bold text-purple-600 bg-purple-50 px-1 rounded">Game</span> (ຊື່ເກມ), <span className="font-bold text-indigo-600 bg-indigo-50 px-1 rounded">Pack</span> (ຊື່ແພັກ), <span className="font-bold text-emerald-600 bg-emerald-50 px-1 rounded">Cost</span> (ຕົ້ນທຶນ), <span className="font-bold text-pink-600 bg-pink-50 px-1 rounded">Retail</span>, <span className="font-bold text-cyan-600 bg-cyan-50 px-1 rounded">Wholesale</span></li>
                                        <li>ຊື່ໃນຖັນ <b>Pack</b> ແລະ <b>Game</b> ຕ້ອງພິມໃຫ້ກົງກັບຊື່ໃນລະບົບປັດຈຸບັນ. (ຖັນ Game ຈະມີ ຫຼື ບໍ່ມີກໍໄດ້)</li>
                                        <li>ໃນ Sheet ໄປທີ່ <b>File &gt; Share &gt; Publish to web</b>.</li>
                                        <li>ເລືອກ <b>Comma-separated values (.csv)</b> ແລ້ວກົດ Publish.</li>
                                        <li>ກັອບປີ້ລິ້ງທີ່ໄດ້ມາວາງໃສ່ຊ່ອງລຸ່ມນີ້ເລີຍ.</li>
                                    </ol>
                                </div>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-500 uppercase ml-1">ລິ້ງ CSV ຈາກ Google Sheet</label>
                                        <div className="relative flex items-center">
                                            <Icon name="link" className="absolute left-4 text-slate-400" size={18} />
                                            <input type="url" placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv" className="w-full bg-white/80 border border-white rounded-2xl pl-11 pr-4 py-4 font-bold text-sm text-slate-800 outline-none focus:ring-2 focus:ring-emerald-400 transition-all shadow-inner" value={sheetUrl} onChange={e => setSheetUrl(e.target.value)} />
                                        </div>
                                    </div>
                                    <button onClick={handleSheetSync} disabled={loading} className="w-full bg-gradient-to-r from-emerald-400 to-teal-500 text-white py-4 rounded-2xl font-black shadow-lg hover:shadow-emerald-500/30 transition-all active:scale-95 flex justify-center items-center gap-2 text-sm disabled:opacity-70 disabled:active:scale-100">
                                        {loading ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <><Icon name="refresh-cw" size={18}/> ດຶງຂໍ້ມູນ ແລະ ອັບເດດເລີຍ</>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add Expense */}
                    {isExpenseModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md animate-pop">
                            <div className="glass-card w-full max-w-sm rounded-[2rem] p-7 shadow-2xl relative border border-white">
                                <button onClick={() => setIsExpenseModalOpen(false)} className="absolute top-5 right-5 p-2.5 text-slate-400 bg-white rounded-full hover:bg-rose-50 hover:text-rose-600 transition-all shadow-sm"><Icon name="x" size={20}/></button>
                                <div className="mb-6">
                                    <div className="w-12 h-12 bg-gradient-to-br from-rose-100 to-pink-100 rounded-2xl flex items-center justify-center text-rose-500 mb-4 shadow-sm border border-white"><Icon name="wallet" size={24}/></div>
                                    <h2 className="text-2xl font-black text-slate-800">ເພີ່ມລາຍຈ່າຍ</h2>
                                    <p className="text-slate-500 text-xs mt-1.5 font-bold">ບັນທຶກຄ່າໃຊ້ຈ່າຍໃໝ່</p>
                                </div>
                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-500 uppercase ml-1">ໝວດໝູ່</label>
                                        <div className="flex flex-wrap gap-2 mb-2">
                                            {expenseCategories.map(c => (
                                                <button key={c} onClick={() => setExpenseForm({...expenseForm, category: c})} className={`text-[10px] px-3 py-1.5 rounded-xl font-black transition-all ${expenseForm.category === c ? 'bg-gradient-to-r from-rose-400 to-pink-500 text-white shadow-md scale-105' : 'bg-white/70 text-slate-600 border border-white hover:border-rose-200 shadow-sm'}`}>{c}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">ຫົວຂໍ້</label><input className="w-full bg-white/80 border border-white rounded-2xl p-3.5 font-bold text-sm text-slate-800 outline-none focus:ring-2 focus:ring-rose-400 transition-all shadow-sm" value={expenseForm.title} onChange={e => setExpenseForm({...expenseForm, title: e.target.value})} placeholder="ຕົວຢ່າງ: ຄ່າເນັດ..." /></div>
                                    <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">ຈຳນວນເງິນ</label><input type="number" className="w-full bg-white/80 border border-white rounded-2xl p-3.5 font-black text-lg text-rose-600 outline-none focus:ring-2 focus:ring-rose-400 transition-all shadow-inner" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} /></div>
                                    <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-500 uppercase ml-1">ໝາຍເຫດ</label><input className="w-full bg-white/80 border border-white rounded-2xl p-3.5 font-medium text-sm text-slate-600 outline-none focus:ring-2 focus:ring-rose-400 transition-all shadow-sm" value={expenseForm.note} onChange={e => setExpenseForm({...expenseForm, note: e.target.value})} /></div>
                                    <button onClick={handleAddExpense} className="w-full bg-gradient-to-r from-rose-500 to-pink-500 text-white py-4 rounded-2xl font-black shadow-lg hover:shadow-rose-500/40 transition-all active:scale-95 text-sm mt-4 tracking-wide">💸 ບັນທຶກລາຍຈ່າຍ</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StatCard = ({ label, value, icon, gradient, isMoney = true, subtext }) => {
            return (
                <div className="glass-card p-6 rounded-[2rem] shadow-glass flex items-center gap-5 hover:-translate-y-1 hover:shadow-xl transition-all duration-300 relative overflow-hidden group">
                    <div className={`absolute -right-6 -top-6 w-24 h-24 bg-gradient-to-br ${gradient} rounded-full blur-2xl opacity-20 group-hover:opacity-40 transition-opacity duration-500`}></div>
                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center bg-gradient-to-br ${gradient} text-white shadow-md group-hover:scale-110 transition-transform duration-300 relative z-10`}>
                        <Icon name={icon} size={28} />
                    </div>
                    <div className="relative z-10">
                        <p className="text-[11px] font-black text-slate-400 uppercase tracking-widest">{label}</p>
                        <p className="text-3xl font-black text-slate-800 mt-1 drop-shadow-sm">{formatNum(value)}{isMoney && <span className="text-lg text-slate-400 font-bold ml-1">₭</span>}</p>
                        {subtext && <p className="text-[10px] text-slate-500 mt-1.5 bg-white/60 inline-block px-2 py-0.5 rounded-lg border border-white font-bold">{subtext}</p>}
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
